# rugen title — Shonen Ink theme. Coordinates are 1280x720. See ../README.md.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
image = "ui/paper.webp"
w = 1280
h = 720

[[node]]
kind = "image"
image = "ui/lines.webp"
w = 1280
h = 720
enter = "fade"
enter_time = 24

# logo + chapter stamp
[[node]]
kind = "image"
id = "logo"
image = "ui/logo.webp"
x = 44
y = 26
scale = 2
enter = "down"
enter_time = 18
ease = "back"

[[node]]
kind = "image"
image = "ui/stamp_chapter.webp"
x = 70
y = 158
scale = 2
enter = "fade"
enter_time = 30
enter_delay = 10

# menu: black slabs, the lit one turns red with a "!!"
[[node]]
kind = "vbox"
id = "menu"
x = 56
y = 222
w = 420
gap = 8
items = "menu"
stagger = 2
enter = "left"
enter_time = 16
ease = "out"

  [[node.children]]
  kind = "button"
  id = "{item.id}"
  h = 50
  image = "ui/slab.webp"
  image_focus = "ui/slab_lit.webp"
  text = "{item.label}"
  font = 2
  bank = 11
  bank_focus = 11
  scale = 2
  align = "left"
  pad = 30
  hover_scale = 1.02
  on_press = "{item.action}"

# manga panels on the right: one big feature, two small
[[node]]
kind = "panel"
image = "ui/panel9.webp"
nine = [12, 12, 24, 24]
x = 520
y = 70
w = 700
h = 390
enter = "right"
enter_time = 18
ease = "out"

  [[node.children]]
  kind = "image"
  image = "{news.0.image}"
  x = 12
  y = 12
  w = 664
  h = 300

  [[node.children]]
  kind = "text"
  text = "{news.0.title}"
  x = 24
  y = 320
  font = 2
  bank = 9
  scale = 2

  [[node.children]]
  kind = "text"
  text = "{news.0.subtitle}"
  x = 24
  y = 350
  w = 640
  font = 1
  bank = 8
  scale = 1.5

  [[node.children]]
  kind = "image"
  image = "ui/bang.webp"
  anchor = "tr"
  x = 18
  y = 10
  scale = 2

[[node]]
kind = "panel"
image = "ui/panel9_red.webp"
nine = [12, 12, 24, 24]
x = 520
y = 486
w = 330
h = 170
enter = "up"
enter_time = 18
enter_delay = 6
ease = "out"

  [[node.children]]
  kind = "image"
  image = "{news.1.image}"
  x = 12
  y = 12
  w = 294
  h = 96

  [[node.children]]
  kind = "text"
  text = "{news.1.title}"
  x = 20
  y = 118
  font = 2
  bank = 9
  scale = 2

[[node]]
kind = "panel"
image = "ui/panel9_black.webp"
nine = [12, 12, 24, 24]
x = 890
y = 486
w = 330
h = 170
enter = "up"
enter_time = 18
enter_delay = 10
ease = "out"

  [[node.children]]
  kind = "image"
  image = "{news.2.image}"
  x = 12
  y = 12
  w = 294
  h = 96

  [[node.children]]
  kind = "text"
  text = "{news.2.title}"
  x = 20
  y = 118
  font = 2
  bank = 11
  scale = 2

# profile line, bottom-left, like a manga credit
[[node]]
kind = "hbox"
anchor = "bl"
x = 60
y = 32
h = 40
gap = 14
align = "center"

  [[node.children]]
  kind = "image"
  image = "{profile.avatar}"
  w = 40
  h = 40

  [[node.children]]
  kind = "text"
  text = "{profile.name}   LV {profile.level}   {profile.wins} W   {profile.shards} SHARDS   VOL.{version}"
  font = 1
  bank = 9
  scale = 2

# footer
[[node]]
kind = "text"
text = "ENTER  SELECT    ESC  BACK    F11  FULLSCREEN"
anchor = "br"
x = 24
y = 12
font = 1
bank = 8
scale = 2
