      text = "{item.label}"
      anchor = "left"
      x = 22
      font = 2
      scale = 1.25
      bank = 9
      when = "idle"

      [[node.children.children.children]]
      kind = "icon"
      glyph = "tri_right"
      anchor = "left"
      x = 22
      w = 14
      h = 14
      when = "focus"

      [[node.children.children.children]]
      kind = "text"
      text = "{item.label}"
      anchor = "left"
      x = 46
      font = 2
      scale = 1.25
      bank = 9
      when = "focus"

      [[node.children.children.children]]
      kind = "hbox"
      anchor = "right"
      x = 16
      w = 620
      gap = 12
      justify = "end"
      align = "center"

        [[node.children.children.children.children]]
        kind = "icon"
        glyph = "tri_left"
        w = 14
        h = 14
        color = [0.878, 0.125, 0.125, 1.0]
        when = "focus"
        visible = "item.adjustable"

        [[node.children.children.children.children]]
        kind = "pips"
        h = 22
        gap = 5
        max_from = "item.max"
        value = "item.on"
        visible = "item.is_pips"

        [[node.children.children.children.children]]
        kind = "choice"
        h = 30
        pad = 14
        font = 2
        bank = 9
        bank_focus = 11
        options = "item.options"
        value = "item.sel"
        visible = "item.is_choice"

        [[node.children.children.children.children]]
        kind = "slider"
        w = 240
        h = 16
        min = 0
        max = 1
        value = "item.frac"
        knob = [20, 32]
        focus = false
        visible = "item.is_slider"

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.text}"
        font = 1
        bank = 9
        scale = 2
        visible = "item.has_text"

        [[node.children.children.children.children]]
        kind = "icon"
        glyph = "ext"
        w = 14
        h = 14
        visible = "item.is_link"

        [[node.children.children.children.children]]
        kind = "icon"
        glyph = "tri_right"
        w = 14
        h = 14
        color = [0.878, 0.125, 0.125, 1.0]
        when = "focus"
        visible = "item.adjustable"

