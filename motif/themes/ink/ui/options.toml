# rugen options — Shonen Ink. Coordinates are 1280x720; data in ../README.md.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
image = "ui/paper.webp"
w = 1280
h = 720

# ---------------------------------------------------------------- header
[[node]]
kind = "panel"
w = 1280
h = 84
color = [0.067, 0.067, 0.067, 1.0]

[[node]]
kind = "text"
text = "OPTIONS"
x = 44
y = 25
font = 3
bank = 10
scale = 2

[[node]]
kind = "text"
text = "OPTIONS"
x = 40
y = 21
font = 3
bank = 11
scale = 2

[[node]]
kind = "text"
text = "SAVED TO RUGEN.TOML"
anchor = "tr"
x = 40
y = 34
font = 2
bank = 6

# ---------------------------------------------------------------- tabs
[[node]]
kind = "vbox"
id = "tabs"
x = 30
y = 120
w = 330
h = 470
gap = 10
items = "tabs"
group = "tabs"
enter = "left"
enter_time = 14
stagger = 2

  [[node.children]]
  kind = "button"
  id = "tab"
  w = 290
  h = 50
  on_press = "{item.press}"

    [[node.children.children]]
    kind = "image"
    image = "ui/tab.webp"
    w = 290
    h = 50
    visible = "!item.active"

    [[node.children.children]]
    kind = "image"
    image = "ui/tab_on.webp"
    w = 330
    h = 60
    visible = "item.active"

    [[node.children.children]]
    kind = "text"
    text = "{item.label}"
    anchor = "left"
    x = 24
    font = 1
    bank = 11
    scale = 2
    visible = "!item.active"

    [[node.children.children]]
    kind = "text"
    text = "{item.label}"
    anchor = "left"
    x = 26
    y = 5
    font = 1
    bank = 11
    scale = 2
    visible = "item.active"

    [[node.children.children]]
    kind = "icon"
    glyph = "ext"
    anchor = "right"
    x = 34
    w = 14
    h = 14
    color = [0.95, 0.94, 0.89, 1.0]
    visible = "item.ext"

# ---------------------------------------------------------------- content panel
[[node]]
kind = "panel"
image = "ui/panel9.webp"
