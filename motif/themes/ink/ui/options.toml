  [[node.children]]
  kind = "list"
  id = "rows"
  x = 20
  y = 62
  w = 830
  h = 392
  items = "rows"
  group = "rows"
  visible = "show_rows"

    [[node.children.children]]
    kind = "button"
    id = "row"
    h = 46
    on_press = "{item.press}"
    on_left = "{item.left}"
    on_right = "{item.right}"

      [[node.children.children.children]]
      kind = "image"
      image = "ui/hatch_red.webp"
      tile = true
      w = "100%"
      h = "100%"
      when = "focus"

      [[node.children.children.children]]
      kind = "panel"
      w = 8
