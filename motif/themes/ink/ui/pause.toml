# rugen pause menu (local matches). Coordinates are 1280x720.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 6

[[node]]
kind = "image"
image = "ui/paper.webp"
w = 1280
h = 720
alpha = 0.5

[[node]]
kind = "panel"
image = "ui/panel9.webp"
nine = [12, 12, 24, 24]
anchor = "center"
w = 460
h = 360
enter = "fade"
enter_time = 10
ease = "back"

  [[node.children]]
  kind = "vbox"
  pad = 30
  gap = 12
  stagger = 2

    [[node.children.children]]
    kind = "text"
    text = "PAUSED"
    align = "center"
    font = 3
    bank = 10
    scale = 3
    h = 70

    [[node.children.children]]
    kind = "button"
    id = "resume"
    h = 54
    image = "ui/slab_lit.webp"
    image_focus = "ui/slab_lit.webp"
    text = "RESUME"
    font = 2
    bank = 11
    bank_focus = 11
    scale = 2
    on_press = "resume"
    hover_scale = 1.03

    [[node.children.children]]
    kind = "button"
    id = "options"
    h = 54
    image = "ui/slab.webp"
    image_focus = "ui/slab_lit.webp"
    text = "OPTIONS"
    font = 2
    bank = 11
    bank_focus = 11
    scale = 2
    on_press = "options"
    hover_scale = 1.03

    [[node.children.children]]
    kind = "button"
    id = "quit"
    h = 54
    image = "ui/slab.webp"
    image_focus = "ui/slab_lit.webp"
    text = "QUIT TO MENU"
    font = 2
    bank = 11
    bank_focus = 11
    scale = 2
    on_press = "quit"
    hover_scale = 1.03

[[node]]
kind = "text"
text = "ESC OR START RESUMES"
anchor = "bottom"
y = 24
font = 1
bank = 8
scale = 2
