# rugen PAUSE — Shonen Ink theme (approved mockup "Pause and move list").
# Coordinates are 1280x720. The fight stays visible, dimmed; the menu sits
# on the left, the move list of the fighter who paused on a white panel.
# Data: scene/has_scene (the frozen fight), menu[] {id label action left
# right}, who, training, show_moves / show_display / show_dummy,
# display[] / dummy[] {id label options sel left right press}, rec {title
# pct line help has}, panel_open, name, title, title_big, col1[] / col2[]
# rows {group label | name cost parts[] {text cap}}, has_moves, no_moves,
# empty, source, facing, paged, keys {start}.
background = [0.07, 0.07, 0.07, 1.0]
exit_time = 6

[[node]]
kind = "image"
fit = "cover"
image = "{scene}"
w = "100%"
h = "100%"
visible = "has_scene"

# dim, not black: the fight stays readable under the menu
[[node]]
kind = "panel"
w = "100%"
h = "100%"
color = [0.04, 0.04, 0.055, 0.34]

# ------------------------------------------------------------------ menu
[[node]]
kind = "panel"
dock = "left"
x = 48
y = 40
w = 344
h = 560
enter = "left"
enter_time = 10

  [[node.children]]
  kind = "text"
  text = "PAUSE"
  font = 1
  scale = 5
  bank = 11
  visible = "!training"

  # TRAINING is longer: smaller, so it stays clear of the panel
  [[node.children]]
  kind = "text"
  text = "TRAINING"
  y = 6
  font = 1
  scale = 3.5
  bank = 11
  visible = "training"

  [[node.children]]
  kind = "text"
  text = "{who}"
  y = 56
  font = 2
  bank = 6
  deck = { w = 372, ellipsis = true }

  [[node.children]]
  kind = "vbox"
  id = "menu"
  y = 92
  w = 344
  gap = 7
  items = "menu"
  group = "menu"
  stagger = 2

    # fixed slot (slab + shadow room) so the list never shifts with the focus
    [[node.children.children]]
    kind = "panel"
    w = 335
    h = 57

    # hard black shadow under the selected slab
    [[node.children.children]]
    kind = "panel"
    x = 5
    y = 5
    w = 330
    h = 52
    color = [0.0, 0.0, 0.0, 1.0]
    when = "focus"

    [[node.children.children]]
    kind = "button"
    id = "slab"
    w = 330
    h = 52
    color = [0.078, 0.071, 0.063, 1.0]
    color_focus = [0.784, 0.063, 0.102, 1.0]
    text = "{item.label}"
    font = 1
    scale = 2
    bank = 11
    bank_focus = 11
    align = "left"
    pad = 18
    on_press = "{item.action}"
    on_left = "{item.left}"
    on_right = "{item.right}"

