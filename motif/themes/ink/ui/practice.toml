# rugen PRACTICE — Shonen Ink theme (roadmap mockup "v2 · PRACTICE hub").
# Coordinates are 1280x720. Title menu → PRACTICE → TRAINING / WATCH / DEBUGGER.
# ◀ ▶ choose a card, A / Enter opens its fighter select, B / Esc back to the title.
# Data: cards[] {id title desc rows[] {name text hot cold} chip_l chip_r new action},
# note, profile, keys, hint.
background = [0.95, 0.93, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/paper.webp"
w = "100%"
h = "100%"

[[node]]
kind = "hbox"
x = 48
y = 26
w = 1184
h = 56
align = "end"
gap = 18
enter = "down"
enter_time = 12

  [[node.children]]
  kind = "text"
  text = "@practice.title"
  font = 1
  scale = 1
  bank = 9
  alpha = 0.72
  text_dy = -6

  [[node.children]]
  kind = "text"
  text = "@practice.practice"
  font = 3
  scale = 2
  bank = 9

  [[node.children]]
  kind = "text"
  text = "@practice.learn_watch_debug"
  font = 1
  scale = 1
  bank = 9
  alpha = 0.72
  text_dy = -6

# the three cards: the focused one turns pink with a red edge over an ink shadow
[[node]]
kind = "hbox"
id = "cards"
x = 48
y = 108
w = 1184
h = 500
gap = 26
items = "cards"
stagger = 3
enter = "up"
enter_time = 16

  [[node.children]]
  kind = "panel"
  x = 10
  y = 10
  w = 377
  h = 500
  color = [0.784, 0.063, 0.102, 1.0]
  when = "blur"

  [[node.children]]
  kind = "panel"
  x = 10
  y = 10
  w = 377
  h = 500
  color = [0.078, 0.071, 0.063, 1.0]
  when = "focus"

  [[node.children]]
  kind = "button"
  id = "card"
  w = 377
  h = 500
  color = [1.0, 1.0, 1.0, 1.0]
  color_focus = [0.984, 0.91, 0.902, 1.0]
  border = 4
  border_color = [0.078, 0.071, 0.063, 1.0]
  border_color_focus = [0.784, 0.063, 0.102, 1.0]
  on_press = "{item.action}"

    [[node.children.children]]
    kind = "text"
    text = "{item.title}"
    x = 24
    y = 26
    font = 1
    scale = 3
    bank = 9
    bank_focus = 10
    inherit_focus = true

    [[node.children.children]]
    kind = "text"
    text = "@practice.new"
    x = 291
    y = 30
    w = 62
    h = 28
    align = "center"
    color = [0.784, 0.063, 0.102, 1.0]
    font = 1
    scale = 1
    bank = 11
    visible = "item.new"

    [[node.children.children]]
    kind = "text"
    text = "{item.desc}"
    x = 24
    y = 92
    w = 329
    wrap = true
    line_h = 30
    font = 2
    bank = 9

    # what the pause menu holds (TRAINING): a framed line per tool
    [[node.children.children]]
    kind = "vbox"
    x = 24
    y = 180
    w = 329
    h = 220
    gap = 8
    items = "item.rows"

      [[node.children.children.children]]
      kind = "panel"
      w = 329
      h = 58
      deck = { h = 62 }
      color = [1.0, 1.0, 1.0, 1.0]
      border = 3
      border_color = [0.784, 0.063, 0.102, 1.0]
      visible = "item.hot"

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.name}"
        x = 10
        y = 6
        h = 20
        font = 1
        scale = 1
        bank = 10

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.text}"
        x = 10
        y = 30
        w = 309
        h = 20
        deck = { y = 32, h = 24 }
        font = 2
        bank = 9

      [[node.children.children.children]]
      kind = "panel"
      w = 329
      h = 58
      deck = { h = 62 }
      color = [1.0, 1.0, 1.0, 1.0]
      border = 3
      border_color = [0.078, 0.071, 0.063, 1.0]
      visible = "item.cold"

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.name}"
        x = 10
        y = 6
        h = 20
        font = 1
        scale = 1
        bank = 9

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.text}"
        x = 10
        y = 30
        w = 309
        h = 20
        deck = { y = 32, h = 24 }
        font = 2
        bank = 9

    [[node.children.children]]
    kind = "panel"
    x = 24
    y = 414
    w = 329
    h = 62
    color = [0.078, 0.071, 0.063, 1.0]

    [[node.children.children]]
    kind = "text"
