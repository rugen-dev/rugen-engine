# rugen result screen — winner art, headline, rounds, next actions. Coordinates are 1280x720.
# Data: headline, winner, winner_art, has_art, p1, p2, rounds, rating, has_rating,
# quick, arcade, can_select, can_rematch, can_title.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 10

[[node]]
kind = "image"
image = "ui/paper.webp"
w = 1280
h = 720

[[node]]
kind = "particles"
w = 1280
h = 720
count = 80
speed = 0.5
size = 3
color = [0.88, 0.13, 0.13, 0.7]
color2 = [0.07, 0.07, 0.07, 0.5]

# winner art plate
[[node]]
kind = "panel"
image = "ui/art9.webp"
nine = [12, 12, 28, 28]
x = 90
y = 80
w = 420
h = 470
enter = "left"
enter_time = 22
ease = "back"

  [[node.children]]
  kind = "image"
  image = "{winner_art}"
  anchor = "top"
  y = 14
  h = 430
  visible = "has_art"

[[node]]
kind = "panel"
image = "ui/slab_lit.webp"
x = 90
y = 562
w = 440
h = 48
enter = "left"
enter_time = 24
enter_delay = 6

  [[node.children]]
  kind = "text"
  text = "{winner}"
  anchor = "left"
  x = 20
  font = 2
  bank = 9
  scale = 2

# headline + rounds
[[node]]
kind = "vbox"
x = 580
y = 90
w = 620
gap = 12
stagger = 4
enter = "right"
enter_time = 20

  [[node.children]]
  kind = "text"
  text = "{headline}"
  font = 3
  bank = 10
  scale = 5
  enter = "right"

  [[node.children]]
  kind = "text"
  text = "{p1}   {rounds}   {p2}"
  font = 2
  bank = 9
  scale = 2
  enter = "right"

  [[node.children]]
  kind = "text"
  text = "RATING {rating}"
  font = 1
  bank = 10
  scale = 2
  visible = "has_rating"
  enter = "right"

# actions
[[node]]
kind = "vbox"
id = "actions"
x = 580
y = 330
w = 360
gap = 10
stagger = 3
enter = "up"
enter_time = 18
enter_delay = 10

  [[node.children]]
  kind = "button"
  id = "rematch"
  h = 54
  image = "ui/slab.webp"
  image_focus = "ui/slab_lit.webp"
  text = "REMATCH"
  font = 2
  bank = 11
  bank_focus = 11
  scale = 2
  on_press = "rematch"
  visible = "can_rematch"
  hover_scale = 1.03

  [[node.children]]
  kind = "button"
  id = "continue"
  h = 54
  image = "ui/slab_lit.webp"
  image_focus = "ui/slab_lit.webp"
  text = "CONTINUE"
  font = 2
  bank = 11
  bank_focus = 11
  scale = 2
  on_press = "continue"
  visible = "arcade"
  hover_scale = 1.03

  [[node.children]]
  kind = "button"
  id = "select"
  h = 54
  image = "ui/slab.webp"
  image_focus = "ui/slab_lit.webp"
  text = "CHARACTER SELECT"
  font = 2
  bank = 11
  bank_focus = 11
  scale = 2
  on_press = "select"
  visible = "can_select"
  hover_scale = 1.03

  [[node.children]]
  kind = "button"
  id = "title"
  h = 54
  image = "ui/slab.webp"
  image_focus = "ui/slab_lit.webp"
  text = "MAIN MENU"
  font = 2
  bank = 11
  bank_focus = 11
  scale = 2
  on_press = "title"
  visible = "can_title"
  hover_scale = 1.03

  [[node.children]]
  kind = "button"
  id = "quit"
  h = 54
  image = "ui/slab.webp"
  image_focus = "ui/slab_lit.webp"
  text = "QUIT"
  font = 2
  bank = 11
  bank_focus = 11
  scale = 2
  on_press = "quit"
  visible = "quick"
  hover_scale = 1.03
