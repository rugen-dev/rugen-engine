# player credit line + picks
[[node]]
kind = "text"
text = "{profile.name}   LV {profile.level}   {profile.wins} W / {profile.losses} L   RATING {rating}"
x = 48
y = 608
font = 1
bank = 9
scale = 2

[[node]]
kind = "text"
text = "P1  {p1.name}     P2  {p2.name}"
x = 48
y = 636
font = 1
bank = 10
scale = 2
visible = "versus"

