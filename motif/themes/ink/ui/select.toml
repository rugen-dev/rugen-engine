# rugen CHARACTER SELECT — Shonen Ink theme (UI book P.02, big-roster layout).
# Coordinates are 1280x720. 12 x 5 cells of 64 px per page; past 60 fighters the
# grid pages (`paged`), PAGE n / N comes from `pages.grid`.
# Data: title, prompt, grid[] {index kind press name face has_face warn broken
# random empty p1 p2}, roster_line, filter, card1/card2 {name_up name_big name_small author portrait
# status ok bad record picked cpu present; facts* / slab_* = those flags
# while no team mode is on; team_on team_off modes[] sizes[] {label on off}
# slots[] {label face has_face picked next empty} team_hint},
# ready, query, sort, keys {a b start team}, teams_ok, team_note.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/sel_bg.webp"
w = "100%"
h = "100%"

# header band
[[node]]
kind = "panel"
dock = "top"
x = 0
y = 0
w = "100%"
h = 56
color = [0.07, 0.07, 0.07, 1.0]
enter = "down"
enter_time = 12

  [[node.children]]
  kind = "text"
  text = "{title}"
  x = 30
  y = 12
  font = 1
  scale = 3
  bank = 11

  [[node.children]]
  kind = "text"
  text = "{prompt}"
  x = 300
  y = 10
  h = 36
  pad = 30
  skew = 18
  color = [0.88, 0.13, 0.13, 1.0]
  font = 1
  scale = 2
  bank = 11

  [[node.children]]
  kind = "hbox"
  dock = "right"
  x = 640
  y = 13
  w = 612
  h = 30
  gap = 10
  justify = "end"
  align = "center"

    [[node.children.children]]
    kind = "text"
    text = "{keys.team}"
    h = 26
    pad = 8
    image = "ui/key9_dark.webp"
    nine = [4, 4, 4, 8]
    font = 2
    bank = 11
    visible = "teams_ok"

    [[node.children.children]]
    kind = "text"
    text = "TEAM MODE  "
    font = 2
    bank = 11
    visible = "teams_ok"

    [[node.children.children]]
    kind = "text"
