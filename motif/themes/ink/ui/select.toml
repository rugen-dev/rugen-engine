# rugen character select — Shonen Ink theme. Coordinates are 1280x720.
# Data: title, prompt, room, cells[] (name thumb badge broken p1 p2 hover index),
# shown{name author art verdict badge stats present}, p1/p2 (same shape), versus,
# ready, searching, query, sort, count, stage{name thumb has_thumb}, profile, rating.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
image = "ui/paper.webp"
w = 1280
h = 720

[[node]]
kind = "image"
image = "ui/lines_left.webp"
w = 1280
h = 720
alpha = 0.7

# header: title in ink, prompt stamp, room
[[node]]
kind = "text"
text = "{title}"
x = 40
y = 18
font = 3
bank = 9
scale = 2
enter = "down"

[[node]]
kind = "panel"
image = "ui/slab_red.webp"
x = 400
y = 16
w = 700
h = 40
enter = "down"
enter_delay = 4

  [[node.children]]
  kind = "text"
  text = "{prompt}"
  anchor = "left"
  x = 24
  font = 1
  bank = 11
  scale = 2

[[node]]
kind = "text"
text = "ROOM {room}"
anchor = "tr"
x = 40
y = 30
font = 1
bank = 10
scale = 1

# roster grid in an ink panel (left)
[[node]]
kind = "panel"
image = "ui/panel9.webp"
nine = [12, 12, 24, 24]
x = 40
y = 72
w = 740
h = 330
enter = "left"
enter_time = 18
ease = "out"

  [[node.children]]
  kind = "grid"
  id = "cells"
  x = 14
  y = 14
  w = 700
  h = 286
  columns = 9
  cell_w = 77
  cell_h = 77
  items = "cells"

    [[node.children.children]]
    kind = "button"
    w = 76
    h = 76
    image = "ui/cell.webp"
    image_focus = "ui/cell_lit.webp"
    on_press = "pick:{item.index}"

      [[node.children.children.children]]
      kind = "image"
      image = "{item.thumb}"
      x = 6
      y = 6
      w = 64
      h = 64
      visible = "item.thumb"

      [[node.children.children.children]]
      kind = "panel"
      color = [0.95, 0.94, 0.89, 0.75]
      x = 6
      y = 6
      w = 64
      h = 64
      visible = "item.broken"

      [[node.children.children.children]]
      kind = "image"
      image = "ui/cell_p1.webp"
      w = 76
      h = 76
      visible = "item.p1"

      [[node.children.children.children]]
      kind = "image"
      image = "ui/cell_p2.webp"
      w = 76
      h = 76
      visible = "item.p2"

      [[node.children.children.children]]
      kind = "image"
      image = "{item.badge}"
      anchor = "tr"
      x = 5
      y = 5
      w = 14
      h = 14
      visible = "item.badge"

# toolbar under the grid
[[node]]
kind = "text"
text = "{count}"
x = 48
y = 422
font = 1
bank = 9
scale = 1.5

[[node]]
