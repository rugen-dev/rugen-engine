# roster grid: 12 x 5 cells, 64 px with 8 px gaps, paged
[[node]]
kind = "grid"
id = "grid"
x = 204
y = 84
w = 856
h = 352
columns = 12
cell_w = 64
cell_h = 64
gap = 8
paged = true
bleed = 40
items = "grid"
enter = "fade"
enter_time = 14

  [[node.children]]
  kind = "button"
  w = 64
  h = 64
  image = "ui/cell_{item.kind}.webp"
  on_press = "{item.press}"

    [[node.children.children]]
    kind = "image"
    image = "{item.face}"
    x = 4
    y = 4
    w = 56
    h = 56
    fit = "cover"
    fit_y = 0.12
    visible = "item.face_ok"

    [[node.children.children]]
    kind = "image"
    image = "{item.face}"
    x = 4
    y = 4
    w = 56
    h = 56
    fit = "cover"
    fit_y = 0.12
    grey = true
    alpha = 0.6
    visible = "item.face_grey"

    # a fighter still converting in the background: dimmed, its initial
    # and a ring filling as it gets ready (a pick waits for it)
    [[node.children.children]]
    kind = "panel"
    x = 4
    y = 4
    w = 56
    h = 56
    color = [0.95, 0.94, 0.89, 0.7]
    visible = "item.preparing"

    [[node.children.children]]
    kind = "text"
    text = "{item.initial}"
    x = 0
    y = 20
    w = 64
    align = "center"
    font = 1
    scale = 2
    bank = 9
    visible = "item.preparing"

    [[node.children.children]]
    kind = "ring"
    x = 9
    y = 9
    w = 46
    h = 46
    value = "item.progress"
    border = 5
    color = [0.0, 0.0, 0.0, 0.3]
    color2 = [0.88, 0.13, 0.13, 1.0]
    visible = "item.preparing"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_x.webp"
    w = 64
    h = 64
    visible = "item.broken"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_warn.webp"
    anchor = "tr"
    w = 26
    h = 26
    visible = "item.warn"

    [[node.children.children]]
    kind = "text"
    text = "1P"
    anchor = "bl"
    h = 22
    pad = 3
    color = [0.88, 0.13, 0.13, 1.0]
    font = 2
    bank = 11
    visible = "item.p1"

    [[node.children.children]]
    kind = "text"
    text = "2P"
    anchor = "br"
    h = 22
    pad = 3
    color = [0.07, 0.07, 0.07, 1.0]
    font = 2
    bank = 11
    visible = "item.p2"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_cur1.webp"
    x = -6
    y = -30
    w = 76
    h = 100
    when = "focus"
    top = true

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_cur2.webp"
    x = -6
    y = -6
    w = 76
    h = 100
    when = "focus2"
    top = true

