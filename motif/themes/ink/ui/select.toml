font = 1
bank = 9
bank_focus = 11
scale = 2
on_press = "sort"

[[node]]
kind = "button"
id = "random"
x = 690
y = 412
w = 120
h = 34
image = "ui/plate.webp"
image_focus = "ui/plate_lit.webp"
text = "RANDOM"
font = 1
bank = 9
bank_focus = 11
scale = 2
on_press = "random"

