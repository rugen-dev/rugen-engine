# ---- MATCHUP (bring your own character): stat face-off. Top row: both
# fighters (portrait, YOU / OPPONENT, name, author, rating) and the server's
# verdict stamp; one panel with the mirrored stats (power first; bars scaled to
# the larger value, the higher side in the accent colour, equal values grey) and
# each side's transfer / check and decision; bottom row: the connection on one
# line (+ HIGH PING), room / mode / IP note, CONFIRM / CHANGE FIGHTER / LEAVE.
# Data: is_matchup, mx.* (title, left/right {present name name_big name_mid
# name_small author portrait has_portrait rating official_block has_official_block},
# left_tag right_tag, pending pending_label has_verdict fair unbalanced blocked
