# rugen ONLINE screen: servers, lobby, rooms, quick match, ranked, leaderboard. 1280x720.
# Data: is_servers/is_add/is_menu/is_lobby/is_create/is_room/is_join/is_queue/is_board/is_direct,
# has_server, no_server, server_line, motd, lobby[] (name host rules count join watch), lobby_empty,
# create.* (name password public rounds time mode chars spect), direct.* (title addr mine fighters),
# status, error, me.*, room.* (code name rules ready waiting rematch role members[] (name role ping
# kick can_kick)), typed, password, opponent.* (.. ping), queue.* (title ..), board[], season, my_rank.
# Official / community: menu[] items carry badge has_badge official community (server list),
# scope (OFFICIAL | COMMUNITY · NAME), ranked_official, me.scope, opponent.scope, last_result,
# has_last_result, mx.stamp stamp_official stamp_other, mx.left/right.official_block.
background = [0.95, 0.94, 0.89, 1.0]

[[node]]
kind = "image"
fit = "cover"
image = "ui/paper.webp"
w = "100%"
h = "100%"

[[node]]
kind = "text"
dock = "top"
text = "ONLINE"
visible = "not_matchup"
x = 0
w = "100%"
y = 42
font = 1
bank = 9
scale = 4
align = "center"
enter = "down"
enter_time = 16

[[node]]
kind = "text"
dock = "top"
text = "{server_line}"
visible = "not_matchup"
x = 0
w = "100%"
y = 112
font = 1
bank = 9
scale = 2
align = "center"

