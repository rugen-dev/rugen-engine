# rugen ONLINE screen (ink): hub (servers + the selected server), rooms lobby,
# room, create room, join by code, PROFILE / accounts, leaderboard, queue, LAN /
# direct IP, matchup. 1280x720. One font family: font 3 for titles, font 1 for
# everything else (scale 1 small, 2 body, 3 big numbers); grey text is ink at
# alpha 0.72. Errors show as a toast in the footer band (toast.*) or a centred
# dialog that keeps the focus (dialog.*). Hotkey hints come from the engine
# (hints.N.key / glyph / label): they only name keys no player binding uses.
# Data: title sub hints chip has_chip lan_key has_lan_key, is_hub is_lobby
# is_create is_room is_join is_queue is_board is_direct is_profile is_matchup
# not_matchup, servers[] (is_server is_add name tag tag_red tag_amber tag_grey
# sub ping on off selected action), sel.* (name tag tag_* motd has_motd online
# rooms ping rank usable unusable reason has_reason retry versions last_result
# has_last_result busy busy_line), lobby.* (rows[] (name tag has_tag host rules
# seats watching live on off full open can_watch action) empty loading count),
# room.* (has code cells[].c name tags[] host_card/chal_card (present name tag
# you line ping has_ping high_ping) spect waiting can_rematch can_kick watching
# copy note has_note wait_line), create.* (count rounds times modes chars joins
# spects + *_sel, preview_name preview_host preview_rules note), join.* (cells[]
# (c active empty filled) bad hint need_password), accts[] (name tag tag_red
# tag_amber status side side_ok side_plain on off selected action), acct.*
# (server on_server details form note has_note name rating devices hint enter
# tab0/tab1 (show label action on off) has_user has_again has_new pass_label
# user_rule rule guest has_guest masked show_label submit error has_error),
# board.* (rows[] (pos top name verified rating record tier) empty loading me.*
# scope), queue.* (time count found searching found_line rule), direct.* (sides
# side mine fighters netplay), toast.* (show title body retry error), dialog.*
# (show kicker title body primary primary_action secondary secondary_action
# has_secondary input), mx.* (matchup, below).
