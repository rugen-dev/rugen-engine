anchor = "bl"
x = 60
y = 60
font = 2
bank = 9
scale = 2

[[node]]
kind = "text"
dock = "left bottom"
text = "{error}"
visible = "has_error"
anchor = "bl"
x = 60
y = 28
font = 1
bank = 10
scale = 2

[[node]]
kind = "text"
dock = "right bottom"
text = "ENTER  SELECT     ESC  BACK"
anchor = "br"
x = 24
y = 16
font = 1
bank = 8
scale = 2
