  font = 2
  bank = 10
  scale = 3

  [[node.children]]
  kind = "text"
  text = "WAITING {queue.secs} S   {queue.count} IN QUEUE"
  x = 30
  y = 90
  font = 1
  bank = 9
  scale = 2

  [[node.children]]
  kind = "text"
