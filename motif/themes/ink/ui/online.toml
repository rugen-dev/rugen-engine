  h = 48
  image = "ui/slab.webp"
  image_focus = "ui/slab_lit.webp"
  text = "CANCEL"
  font = 2
  bank = 11
  bank_focus = 11
  scale = 2
  align = "left"
  pad = 26
  on_press = "online:cancel"

# ---- leaderboard
[[node]]
kind = "panel"
dock = "left"
visible = "is_board"
image = "ui/panel9.webp"
nine = [12, 12, 24, 24]
x = 60
y = 150
w = 760
h = 500
enter = "up"
enter_time = 16

  [[node.children]]
  kind = "text"
  text = "{season}   {my_rank}"
  x = 24
  y = 16
  font = 1
  bank = 10
  scale = 2

  [[node.children]]
  kind = "list"
  x = 16
  y = 50
  w = 728
  h = 380
  gap = 4
  items = "board"

    [[node.children.children]]
    kind = "panel"
    h = 34
    image = "ui/row.webp"
    nine = [4, 4, 4, 4]

      [[node.children.children.children]]
      kind = "text"
      text = "#{item.pos}  {item.name}"
      x = 16
      y = 8
      font = 1
      bank = 9
      scale = 2

      [[node.children.children.children]]
      kind = "text"
      text = "{item.rank}  {item.rating}   {item.record}"
      anchor = "tr"
      x = 16
      y = 8
      font = 1
      bank = 8
      scale = 2

  [[node.children]]
  kind = "button"
  id = "board_back"
  anchor = "bl"
  x = 16
  y = 16
  w = 220
  h = 44
  image = "ui/slab.webp"
  image_focus = "ui/slab_lit.webp"
  text = "BACK"
  font = 2
  bank = 11
  bank_focus = 11
  scale = 2
  align = "left"
  pad = 26
  on_press = "online:cancel"

# status / error footer
