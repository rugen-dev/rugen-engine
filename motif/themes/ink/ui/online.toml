# ---- direct match: type the peer address
[[node]]
kind = "panel"
dock = "left"
visible = "is_direct"
image = "ui/panel9.webp"
nine = [12, 12, 24, 24]
x = 60
y = 190
w = 720
h = 330
enter = "up"
enter_time = 16

  [[node.children]]
  kind = "text"
  text = "{direct.title}"
  x = 30
  y = 24
  font = 2
  bank = 10
  scale = 2

  [[node.children]]
  kind = "text"
  text = "PEER ADDRESS (IP OR IP:PORT)"
  x = 30
  y = 66
  font = 1
  bank = 8
  scale = 2

  [[node.children]]
  kind = "input"
  id = "addr"
  x = 30
  y = 96
  w = 640
  h = 60
  font = 2
  bank = 9
  scale = 3
  max_len = 40
  placeholder = "192.168.1.20"
  value = "direct.addr"
  on_change = "addr:{value}"
  on_press = "direct:go"

  [[node.children]]
  kind = "text"
  text = "YOUR ADDRESS: {direct.mine}"
  x = 30
  y = 178
  font = 2
  bank = 9
  scale = 2

  [[node.children]]
  kind = "text"
  text = "{direct.fighters}"
  x = 30
  y = 216
  font = 1
  bank = 8
  scale = 2

  [[node.children]]
  kind = "text"
  text = "ENTER CONNECTS   ESC CANCELS"
  anchor = "bl"
  x = 30
  y = 24
  font = 1
  bank = 8
  scale = 2

# ---- ranked queue
[[node]]
kind = "panel"
dock = "left"
visible = "is_queue"
image = "ui/panel9.webp"
