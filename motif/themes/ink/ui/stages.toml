# rugen STAGE SELECT — Shonen Ink theme. Coordinates are 1280x720.
# Fighter select → STAGE SELECT → versus → fight. Player 1 picks: ◀▶ (held:
# repeats, then faster), X / Z or Page Up / Down a strip-width, Home / End,
# a letter jumps by name; A / Enter fights, B / Esc goes back to the fighters.
# Data: title, sub, go, p1, p2, cur {name author has_author tags[] {t} music
# has_music width has_width random note}, preview_ready, preview_wait,
# strip[] {x index name thumb has_thumb placeholder random sel idle} (only the tiles
# on screen: the strip is virtualised), pos, track {x w scrolls}, keys.
# `stage_preview` is a slot: the stage under the cursor, live, drawn by rugen.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/sel_bg.webp"
w = "100%"
h = "100%"

# header band: STAGE, who picks, the matchup
[[node]]
kind = "panel"
dock = "top"
x = 0
y = 0
w = "100%"
h = 56
color = [0.07, 0.07, 0.07, 1.0]
enter = "down"
enter_time = 12

  [[node.children]]
  kind = "text"
  text = "{title}"
  x = 30
  y = 12
  font = 1
  scale = 3
  bank = 11

  [[node.children]]
  kind = "text"
  text = "{sub}"
  x = 196
  y = 22
  font = 2
  bank = 11

  [[node.children]]
  kind = "hbox"
  dock = "right"
  x = 640
  y = 11
  w = 612
  h = 34
  gap = 12
  justify = "end"
  align = "center"

    [[node.children.children]]
    kind = "text"
    text = "{p1}"
    h = 34
    pad = 12
    color = [0.88, 0.13, 0.13, 1.0]
    font = 1
    scale = 2
    bank = 11

    [[node.children.children]]
    kind = "text"
    text = "VS"
    font = 1
    scale = 2
    bank = 11

    [[node.children.children]]
    kind = "text"
    text = "{p2}"
    h = 34
    pad = 12
    image = "ui/key9.webp"
    nine = [4, 4, 4, 8]
    font = 1
    scale = 2
    bank = 9

