# rugen ONLINE screen: servers, lobby, rooms, quick match, ranked, leaderboard. 1280x720.
# Data: is_servers/is_add/is_menu/is_lobby/is_create/is_room/is_join/is_queue/is_board/is_direct,
# has_server, no_server, server_line, motd, lobby[] (name host rules count join watch), lobby_empty,
# create.* (name password public rounds time mode chars spect), direct.* (title addr mine fighters),
# status, error, me.*, room.* (code name rules ready waiting rematch role members[] (name role ping
# kick can_kick)), typed, password, opponent.* (.. ping), queue.* (title ..), board[], season, my_rank.
background = [0.03, 0.04, 0.08, 1.0]

[[node]]
kind = "image"
fit = "cover"
image = "ui/bg.webp"
w = "100%"
h = "100%"

[[node]]
kind = "text"
dock = "top"
text = "ONLINE"
x = 0
w = "100%"
y = 42
font = 3
bank = 0
scale = 2
align = "center"
enter = "down"
enter_time = 16

[[node]]
kind = "text"
dock = "top"
text = "{server_line}"
x = 0
w = "100%"
y = 112
font = 1
bank = 6
scale = 2
align = "center"

# player card (with a server)
[[node]]
kind = "panel"
dock = "right"
visible = "has_server"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
anchor = "tr"
x = 40
y = 150
w = 400
h = 150
