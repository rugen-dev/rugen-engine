# rugen title screen — Neon Dojo. Edit freely, see README.md. Coordinates are 1280x720.
background = [0.05, 0.06, 0.1, 1.0]

# background: base gloss, slash layer, floor — each slides in at its own pace
[[node]]
kind = "image"
image = "ui/bg_sky.webp"
w = 1280
h = 720
enter = "fade"
enter_time = 24

[[node]]
kind = "image"
image = "ui/bg_far.webp"
w = 1280
h = 720
enter = "right"
enter_time = 30

[[node]]
kind = "image"
image = "ui/bg_near.webp"
w = 1280
h = 720
enter = "up"
enter_time = 22

[[node]]
kind = "image"
id = "logo"
image = "ui/logo.webp"
x = 56
y = 36
scale = 2
enter = "down"
enter_time = 22

# profile strip (skewed slab, red avatar square)
[[node]]
kind = "image"
image = "ui/strip.webp"
anchor = "tr"
x = 24
y = 28
w = 560
h = 76
enter = "right"
enter_time = 20

[[node]]
kind = "image"
image = "{profile.avatar}"
anchor = "tr"
x = 514
y = 38
w = 56
h = 56
enter = "right"
enter_time = 20

[[node]]
kind = "text"
text = "{profile.name}"
anchor = "tr"
x = 24
y = 38
w = 470
font = 2
bank = 7
scale = 2
align = "left"
pad = 0
enter = "right"
enter_time = 20

[[node]]
kind = "text"
text = "LEVEL {profile.level}   {profile.shards} SHARDS   {profile.wins}W {profile.losses}L"
anchor = "tr"
x = 24
y = 72
w = 470
font = 1
bank = 4
scale = 2
align = "left"
pad = 0
enter = "right"
enter_time = 20

# main menu: one slanted button per entry of `menu`
[[node]]
kind = "vbox"
id = "menu"
x = 60
y = 196
w = 400
gap = 8
items = "menu"
enter = "left"
enter_time = 20

  [[node.children]]
  kind = "button"
  id = "{item.id}"
  h = 54
  image = "ui/button.webp"
  image_focus = "ui/button_lit.webp"
  text = "{item.label}"
  font = 2
  bank = 7
  bank_focus = 7
  scale = 2
  align = "left"
  pad = 28
  hover_scale = 1.03
  on_press = "{item.action}"

