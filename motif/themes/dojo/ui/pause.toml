# rugen pause menu (local matches). Coordinates are 1280x720.
background = [0.02, 0.02, 0.05, 1.0]
exit_time = 6

[[node]]
kind = "image"
fit = "cover"
image = "ui/bg.webp"
w = "100%"
h = "100%"
alpha = 0.5

[[node]]
kind = "panel"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
anchor = "center"
w = 460
h = 360
enter = "fade"
enter_time = 10
ease = "back"

  [[node.children]]
  kind = "vbox"
  pad = 30
  gap = 12
  stagger = 2

    [[node.children.children]]
    kind = "text"
    text = "PAUSED"
    align = "center"
    font = 3
    bank = 0
    scale = 3
    h = 70

    [[node.children.children]]
    kind = "button"
    id = "resume"
    h = 54
    image = "ui/button_lit.webp"
    image_focus = "ui/button_lit.webp"
    text = "RESUME"
    font = 2
    bank = 7
    bank_focus = 4
    scale = 2
    on_press = "resume"
    hover_scale = 1.03

    [[node.children.children]]
    kind = "button"
    id = "options"
    h = 54
    image = "ui/button.webp"
    image_focus = "ui/button_lit.webp"
    text = "OPTIONS"
    font = 2
    bank = 7
    bank_focus = 4
    scale = 2
    on_press = "options"
    hover_scale = 1.03

    [[node.children.children]]
    kind = "button"
    id = "quit"
    h = 54
    image = "ui/button.webp"
    image_focus = "ui/button_lit.webp"
    text = "QUIT TO MENU"
    font = 2
    bank = 7
    bank_focus = 4
    scale = 2
    on_press = "quit"
    hover_scale = 1.03

[[node]]
kind = "text"
dock = "bottom"
text = "ESC RESUMES"
anchor = "bottom"
y = 24
font = 1
bank = 6
scale = 2
