# rugen CHALLENGE — Dojo theme (restyled from the ink screen: same nodes and binds).
# Coordinates are 1280x720. Title menu → CHALLENGE → fighter select → the run.
# ◀ ▶ choose a card, A / Enter starts its fighter select, B / Esc goes back.
# Data: cards[] {id title desc hud_l hud_r best action}, profile, keys, hint.
# Jersey for text (font 2 small, 6 body, 3 big); banks 12 sumi, 13 vermilion,
# 14 washi, 16 brass, 17 soft sumi.
background = [0.078, 0.051, 0.043, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/hall.webp"
w = "100%"
h = "100%"

[[node]]
kind = "hbox"
x = 48
y = 26
w = 1000
h = 56
align = "end"
gap = 18
enter = "down"
enter_time = 12

  [[node.children]]
  kind = "text"
  text = "@challenge.challenge"
  font = 3
  bank = 14
  text_dy = 2

  [[node.children]]
  kind = "text"
  text = "@challenge.pick_a_run_and_a_fighter"
  font = 2
  bank = 16
  text_dy = -6

# the three modes: the focused card is the lit sheet in a brass edge over a vermilion shadow
[[node]]
kind = "hbox"
id = "cards"
x = 48
y = 108
w = 1184
h = 500
gap = 26
items = "cards"
stagger = 3
enter = "up"
enter_time = 16

  [[node.children]]
  kind = "panel"
  x = 10
  y = 10
  w = 377
  h = 500
  color = [0.204, 0.122, 0.078, 1.0]
  when = "blur"

  [[node.children]]
  kind = "panel"
  x = 10
  y = 10
  w = 377
  h = 500
  color = [0.706, 0.188, 0.102, 1.0]
  when = "focus"

  [[node.children]]
  kind = "button"
  id = "card"
  w = 377
  h = 500
  image = "ui/sheet9.webp"
  image_focus = "ui/sheet9_lit.webp"
  nine = [12, 12, 12, 12]
  border = 4
  border_color = [0.0, 0.0, 0.0, 0.0]
  border_color_focus = [0.89, 0.702, 0.298, 1.0]
  on_press = "{item.action}"

    [[node.children.children]]
    kind = "text"
    text = "{item.title}"
    x = 24
    y = 24
    font = 3
    bank = 12
    bank_focus = 13
    inherit_focus = true

    [[node.children.children]]
    kind = "text"
    text = "{item.desc}"
    x = 24
    y = 96
    w = 329
    wrap = true
    line_h = 28
    font = 6
    bank = 12

    [[node.children.children]]
    kind = "text"
    text = "{item.note}"
    x = 24
    y = 332
    w = 329
    h = 28
    deck = { y = 304, h = 62, wrap = true, line_gap = 2 }
    font = 2
    bank = 13

    [[node.children.children]]
    kind = "panel"
    x = 24
    y = 372
    w = 329
    h = 40
    deck = { h = 62 }
    color = [0.133, 0.078, 0.059, 1.0]

    [[node.children.children]]
    kind = "text"
    text = "{item.hud_l}"
    x = 36
    y = 372
    h = 40
    deck = { h = 31 }
    font = 2
    bank = 14

    [[node.children.children]]
    kind = "text"
    text = "{item.hud_r}"
    x = 36
    y = 372
    w = 305
    h = 40
    deck = { y = 403, h = 31 }
    align = "right"
    font = 2
    bank = 14

    [[node.children.children]]
    kind = "text"
    text = "@challenge.your_best"
    x = 24
    y = 426
    deck = { y = 442 }
    h = 28
    font = 2
    bank = 17

    [[node.children.children]]
    kind = "text"
    text = "{item.best}"
    x = 24
    y = 452
    w = 329
    deck = { y = 466 }
    h = 32
    font = 6
    bank = 12

[[node]]
kind = "text"
text = "@challenge.best_scores_are_saved_per_fighter"
x = 48
y = 652
h = 36
font = 2
bank = 16

[[node]]
kind = "hbox"
x = 560
y = 652
w = 672
h = 36
gap = 8
justify = "end"
align = "center"

  [[node.children]]
  kind = "text"
  text = "◀ ▶"
  h = 36
  pad = 10
  image = "ui/key9.webp"
  nine = [4, 4, 4, 8]
  font = 1
  scale = 2
  bank = 12

  [[node.children]]
  kind = "text"
  text = "@common.choose  "
  font = 2
  bank = 16

  [[node.children]]
  kind = "text"
  text = "{hint.ok}"
  h = 36
  pad = 10
  image = "ui/key9.webp"
  nine = [4, 4, 4, 8]
  font = 1
  scale = 2
  bank = 12

  [[node.children]]
  kind = "text"
  text = "@common.start  "
  font = 2
  bank = 16

  [[node.children]]
  kind = "text"
  text = "{hint.back}"
  h = 36
  pad = 10
