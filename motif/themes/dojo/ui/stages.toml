# rugen STAGE SELECT — Dojo theme. Coordinates are 1280x720.
# Fighter select → STAGE SELECT → versus → fight. Player 1 picks: ◀▶ (held:
# repeats, then faster), X or S / Z (pad L1 / R1) or Page Up / Down a
# strip-width, Home / End,
# a letter jumps by name; A / Enter fights, B / Esc goes back to the fighters.
# Data: title, sub, go, p1, p2, cur {name author has_author tags[] {t} music
# has_music width has_width random note}, preview_ready, preview_wait,
# strip[] {x index name thumb has_thumb placeholder random sel idle} (only the tiles
# on screen: the strip is virtualised), pos, track {x w scrolls}, keys.
# `stage_preview` is a slot: the stage under the cursor, live, drawn by rugen.
background = [0.078, 0.051, 0.043, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/hall.webp"
w = "100%"
h = "100%"

# header under the beam: STAGE, who picks, the matchup on plaques
[[node]]
kind = "text"
dock = "left top"
text = "{title}"
x = 44
y = 30
font = 3
bank = 14
enter = "down"
enter_time = 12

[[node]]
kind = "text"
dock = "left top"
text = "{sub}"
x = 200
y = 42
font = 2
bank = 16
enter = "down"
enter_time = 12

[[node]]
kind = "hbox"
dock = "right top"
x = 620
y = 30
w = 616
h = 40
gap = 12
justify = "end"
align = "center"
enter = "down"
enter_time = 12

  [[node.children]]
  kind = "text"
  text = "{p1}"
  h = 40
  pad = 16
  image = "ui/plaque9_red.webp"
  nine = [8, 8, 8, 10]
  font = 6
  bank = 14

  [[node.children]]
  kind = "text"
  text = "VS"
  font = 6
  bank = 15

  [[node.children]]
  kind = "text"
  text = "{p2}"
  h = 40
  pad = 16
  image = "ui/plaque9_gold.webp"
  nine = [8, 8, 8, 10]
  font = 6
  bank = 12

# live preview in a lacquer frame, the stage inside
