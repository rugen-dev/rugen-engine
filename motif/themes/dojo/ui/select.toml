bank = 3
scale = 3

[[node]]
kind = "text"
text = "WINS"
x = 492
y = 538
font = 1
bank = 6
scale = 2

[[node]]
kind = "image"
image = "{profile.avatar}"
x = 818
y = 462
w = 56
h = 56

[[node]]
kind = "text"
text = "LEVEL {profile.level}"
x = 636
y = 470
font = 1
bank = 4
scale = 2

[[node]]
kind = "text"
text = "{profile.losses} LOSSES"
x = 636
y = 496
font = 1
bank = 6
scale = 2

[[node]]
kind = "text"
text = "RATING {rating}"
x = 636
y = 522
font = 1
bank = 7
scale = 2

# stage strip
[[node]]
kind = "panel"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
x = 920
y = 448
w = 322
h = 120
enter = "up"
enter_time = 20

  [[node.children]]
  kind = "text"
  text = "STAGE"
  x = 12
  y = 8
  font = 1
  bank = 4
  scale = 2

  [[node.children]]
  kind = "image"
  image = "{stage.thumb}"
  x = 12
  y = 32
  w = 120
  h = 68
  visible = "stage.has_thumb"

  [[node.children]]
  kind = "panel"
  color = [0.08, 0.1, 0.18, 1.0]
