# footer bar
[[node]]
kind = "panel"
color = [0.04, 0.05, 0.08, 1.0]
anchor = "bl"
w = 1280
h = 30

[[node]]
kind = "panel"
color = [0.63, 0.07, 0.17, 1.0]
anchor = "bl"
y = 30
w = 1280
