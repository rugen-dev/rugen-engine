[[node]]
kind = "button"
id = "random"
x = 1108
y = 400
w = 134
h = 32
image = "ui/plate.webp"
image_focus = "ui/plate_lit.webp"
text = "RANDOM"
font = 1
bank = 7
scale = 2
on_press = "random"

# player card (skewed, big gold number)
[[node]]
kind = "image"
image = "ui/card.webp"
x = 466
y = 448
w = 444
h = 120
enter = "up"
