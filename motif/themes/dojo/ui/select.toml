# rugen character select — Neon Dojo roster. Coordinates are 1280x720.
# Data: title, prompt, room, cells[] (name thumb badge broken p1 p2 hover index),
# shown{name author art verdict badge stats present}, p1/p2 (same shape), versus,
# ready, searching, query, sort, count, stage{name thumb has_thumb}, profile, rating.
background = [0.05, 0.06, 0.1, 1.0]

[[node]]
kind = "image"
image = "ui/bg.webp"
w = 1280
h = 720

# header
[[node]]
kind = "text"
text = "{title}"
x = 40
y = 16
font = 3
bank = 0
scale = 2
enter = "down"

[[node]]
kind = "text"
text = "{prompt}"
x = 470
y = 28
font = 1
bank = 4
scale = 2

# big art plate (left column)
[[node]]
kind = "image"
id = "art"
image = "ui/art_frame.webp"
x = 40
y = 68
w = 400
h = 440
enter = "left"
enter_time = 20

[[node]]
kind = "image"
image = "{shown.art}"
x = 60
y = 84
h = 404
visible = "shown.present"
enter = "left"
enter_time = 20

# info strip under the plate
[[node]]
kind = "panel"
image = "ui/plate_lit.webp"
x = 40
y = 516
w = 400
h = 44
enter = "left"
enter_time = 22

  [[node.children]]
  kind = "text"
  text = "{shown.name}"
  anchor = "left"
  x = 20
  font = 2
  bank = 7
  scale = 2

[[node]]
kind = "panel"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
x = 40
y = 566
w = 400
h = 108
enter = "left"
enter_time = 24

  [[node.children]]
  kind = "text"
  text = "BY {shown.author}"
  x = 14
  y = 10
  font = 1
  bank = 6
  scale = 2

  [[node.children]]
  kind = "image"
  image = "{shown.badge}"
  x = 14
  y = 36
  w = 16
  h = 16
  visible = "shown.badge"

  [[node.children]]
  kind = "text"
  text = "{shown.verdict}"
  x = 38
  y = 34
  font = 1
  bank = 4
  scale = 2

  [[node.children]]
  kind = "text"
  text = "{shown.stats}"
  x = 14
  y = 58
  font = 1
  bank = 7
  scale = 2

  [[node.children]]
  kind = "text"
  text = "P1 {p1.name}   P2 {p2.name}"
  x = 14
  y = 82
  font = 1
  bank = 5
  scale = 2
  visible = "versus"

# roster grid
[[node]]
kind = "panel"
color = [0.05, 0.06, 0.12, 0.8]
x = 466
y = 62
w = 780
h = 330

[[node]]
kind = "grid"
id = "cells"
x = 470
y = 66
w = 772
h = 322
columns = 10
cell_w = 77
cell_h = 77
items = "cells"
enter = "right"
enter_time = 20

  [[node.children]]
  kind = "button"
  w = 76
  h = 76
  image = "ui/cell.webp"
  image_focus = "ui/cell_lit.webp"
  on_press = "pick:{item.index}"

    [[node.children.children]]
    kind = "image"
    image = "{item.thumb}"
    x = 6
    y = 6
    w = 64
    h = 64
    visible = "item.thumb"

    [[node.children.children]]
    kind = "panel"
    color = [0.0, 0.0, 0.0, 0.65]
    x = 6
    y = 6
    w = 64
    h = 64
    visible = "item.broken"

    [[node.children.children]]
    kind = "image"
    image = "ui/cell_p1.webp"
    w = 76
    h = 76
    visible = "item.p1"

    [[node.children.children]]
    kind = "image"
    image = "ui/cell_p2.webp"
    w = 76
    h = 76
    visible = "item.p2"

    [[node.children.children]]
    kind = "image"
    image = "{item.badge}"
    anchor = "tr"
    x = 5
    y = 5
    w = 14
    h = 14
    visible = "item.badge"

# grid toolbar
[[node]]
kind = "text"
text = "{count}"
x = 474
y = 406
font = 1
bank = 6
scale = 2

[[node]]
kind = "button"
id = "search"
x = 748
y = 400
w = 130
h = 32
image = "ui/plate.webp"
image_focus = "ui/plate_lit.webp"
text = "SEARCH"
font = 1
bank = 7
scale = 2
on_press = "search"

[[node]]
kind = "button"
id = "sort"
x = 886
y = 400
w = 214
h = 32
image = "ui/plate.webp"
image_focus = "ui/plate_lit.webp"
text = "SORT: {sort}"
font = 1
bank = 7
scale = 2
