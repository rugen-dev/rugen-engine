  [[node.children]]
  kind = "button"
  id = "stage_random"
  x = 244
  y = 66
  w = 68
  h = 32
  image = "ui/plate.webp"
  image_focus = "ui/plate_lit.webp"
  text = "RND"
  font = 1
  bank = 7
  scale = 2
  on_press = "stage:random"

# confirm / back
[[node]]
kind = "button"
id = "confirm"
x = 920
y = 598
w = 322
h = 54
image = "ui/button_lit.webp"
image_focus = "ui/button_lit.webp"
text = "CONFIRM"
font = 2
bank = 7
bank_focus = 4
scale = 2
