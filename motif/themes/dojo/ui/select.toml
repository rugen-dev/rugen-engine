# rugen CHARACTER SELECT — Dojo theme. Coordinates are 1280x720.
# 12 x 5 cells of 64 px per page; past 60 fighters the grid pages (`paged`),
# PAGE n / N comes from `pages.grid`.
# Data: title, prompt, grid[] {index kind press name face has_face warn broken
# random empty p1 p2}, roster_line, filter, card1/card2 {name_up name_big name_small author portrait
# status ok bad record picked cpu present; facts* / slab_* = those flags
# while no team mode is on; team_on team_off modes[] sizes[] {label on off}
# slots[] {label face has_face picked next empty} team_hint},
# ready, query, sort, keys {a b start team}, teams_ok, team_note.
background = [0.078, 0.051, 0.043, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/hall.webp"
w = "100%"
h = "100%"

# header under the beam: mode, the prompt on a vermilion plaque, keys
