# rugen CHARACTER SELECT — Dojo theme. Coordinates are 1280x720.
# 12 x 5 cells of 64 px per page; past 60 fighters the grid pages (`paged`),
# PAGE n / N comes from `pages.grid`.
# Data: title, prompt, grid[] {index kind press name face has_face warn broken
# random empty p1 p2}, roster_line, filter, card1/card2 {name_up name_big name_small author portrait
# status ok bad record picked cpu present}, stage {name thumb has_thumb index count},
# ready, query, sort, keys {a b start}.
background = [0.078, 0.051, 0.043, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/hall.webp"
w = "100%"
h = "100%"

# header under the beam: mode, the prompt on a vermilion plaque, keys
[[node]]
kind = "text"
dock = "left top"
text = "{title}"
x = 44
y = 30
font = 3
bank = 14
enter = "down"
enter_time = 12

[[node]]
kind = "text"
dock = "left top"
text = "{prompt}"
x = 300
y = 34
h = 40
pad = 22
image = "ui/plaque9_red.webp"
nine = [8, 8, 8, 10]
font = 6
bank = 14
enter = "down"
enter_time = 12

[[node]]
kind = "hbox"
dock = "right top"
x = 780
y = 36
w = 456
h = 30
gap = 10
justify = "end"
align = "center"

  [[node.children]]
  kind = "text"
  text = "TAB"
  h = 28
  pad = 8
  image = "ui/key9.webp"
  nine = [4, 4, 4, 8]
  font = 1
  scale = 2
  bank = 12

  [[node.children]]
  kind = "text"
  text = "SEARCH  "
  font = 2
  bank = 16

  [[node.children]]
  kind = "text"
  text = "F1"
  h = 28
  pad = 8
  image = "ui/key9.webp"
  nine = [4, 4, 4, 8]
  font = 1
  scale = 2
  bank = 12

  [[node.children]]
  kind = "text"
  text = "SORT: {sort}"
  font = 2
  bank = 16

# roster grid: 12 x 5 wooden frames, 64 px with 8 px gaps, paged
[[node]]
kind = "grid"
id = "grid"
x = 204
y = 100
w = 856
h = 352
columns = 12
cell_w = 64
cell_h = 64
gap = 8
paged = true
bleed = 40
items = "grid"
enter = "fade"
enter_time = 14

  [[node.children]]
  kind = "button"
  w = 64
  h = 64
  image = "ui/cell_{item.kind}.webp"
  on_press = "{item.press}"

    [[node.children.children]]
    kind = "image"
    image = "{item.face}"
    x = 4
    y = 4
    w = 56
    h = 56
    fit = "cover"
    fit_y = 0.12
    visible = "item.face_ok"

    [[node.children.children]]
    kind = "image"
    image = "{item.face}"
    x = 4
    y = 4
    w = 56
    h = 56
    fit = "cover"
    fit_y = 0.12
    grey = true
    alpha = 0.6
    visible = "item.face_grey"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_x.webp"
    w = 64
    h = 64
    visible = "item.broken"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_warn.webp"
    anchor = "tr"
    w = 26
    h = 26
    visible = "item.warn"

    [[node.children.children]]
    kind = "text"
    text = "1P"
    anchor = "bl"
    h = 20
    pad = 4
    color = [0.706, 0.188, 0.102, 1.0]
    font = 1
    bank = 14
    visible = "item.p1"

    [[node.children.children]]
    kind = "text"
    text = "2P"
    anchor = "br"
    h = 20
    pad = 4
    color = [0.89, 0.702, 0.298, 1.0]
    font = 1
    bank = 12
    visible = "item.p2"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_cur1.webp"
    x = -6
    y = -30
    w = 76
    h = 100
    when = "focus"
    top = true

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_cur2.webp"
    x = -6
    y = -6
    w = 76
    h = 100
    when = "focus2"
    top = true

# roster facts under the grid
[[node]]
kind = "text"
text = "{roster_line}"
x = 204
y = 464
font = 2
bank = 16
visible = "!ready"

[[node]]
kind = "text"
text = "PAGE {pages.grid.page} / {pages.grid.count}"
x = 860
y = 464
w = 200
align = "right"
font = 2
bank = 16
visible = "!searching"

# Tab search: a key-cap box while typing (arrows / Enter close it, Esc clears)
[[node]]
kind = "panel"
x = 592
y = 456
w = 240
h = 32
image = "ui/key9.webp"
nine = [4, 4, 4, 8]
visible = "searching"

[[node]]
kind = "text"
text = "ESC CLEARS"
x = 840
y = 464
font = 2
bank = 13
visible = "searching"

[[node]]
kind = "input"
id = "search"
x = 604
y = 462
w = 220
h = 24
focus = false
placeholder = ""
max_len = 16
font = 2
bank = 12
on_change = "query:{value}"

