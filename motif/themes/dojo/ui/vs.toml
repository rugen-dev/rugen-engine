# rugen VS screen — two diagonal halves, big art, stage, countdown. Coordinates are 1280x720.
# Data: p1{name art has_art}, p2{...}, stage{name thumb has_thumb}, countdown.
background = [0.03, 0.04, 0.08, 1.0]
exit_time = 10

[[node]]
kind = "image"
fit = "cover"
image = "ui/bg.webp"
w = "100%"
h = "100%"

# red half (P1)
[[node]]
kind = "panel"
anchor = "tr"
dock = "fill"
color = [0.55, 0.12, 0.16, 0.85]
x = "50%"
y = 0
w = 1100
h = "100%"
skew = -140
enter = "left"
enter_time = 16

# blue half (P2)
[[node]]
kind = "panel"
dock = "fill"
color = [0.12, 0.2, 0.55, 0.85]
x = "50%"
y = 0
w = 1100
h = "100%"
skew = -140
enter = "right"
enter_time = 16

[[node]]
kind = "particles"
w = "100%"
h = "100%"
count = 60
speed = 0.6
size = 3
color = [1.0, 0.75, 0.3, 0.7]
color2 = [0.5, 0.7, 1.0, 0.5]

# P1 art plate
[[node]]
kind = "panel"
dock = "left"
image = "ui/art_frame.webp"
nine = [10, 10, 10, 10]
x = 70
y = 90
w = 420
h = 470
enter = "left"
enter_time = 20
enter_delay = 4
ease = "back"

  [[node.children]]
  kind = "image"
  image = "{p1.art}"
  anchor = "top"
  y = 14
  h = 430
  visible = "p1.has_art"

[[node]]
kind = "panel"
dock = "left"
image = "ui/plate_lit.webp"
x = 70
y = 572
w = 440
h = 48
enter = "left"
enter_time = 22
enter_delay = 8

  [[node.children]]
  kind = "text"
  text = "{p1.name}"
  anchor = "left"
  x = 20
  font = 2
  bank = 7
  scale = 2

# P2 art plate
[[node]]
kind = "panel"
dock = "right"
image = "ui/art_frame.webp"
nine = [10, 10, 10, 10]
anchor = "tr"
x = 70
y = 90
w = 420
h = 470
enter = "right"
enter_time = 20
enter_delay = 4
ease = "back"

  [[node.children]]
  kind = "image"
  image = "{p2.art}"
  anchor = "top"
  y = 14
  h = 430
  visible = "p2.has_art"

[[node]]
kind = "panel"
dock = "right"
image = "ui/plate_lit.webp"
anchor = "tr"
x = 70
y = 572
w = 440
h = 48
enter = "right"
enter_time = 22
enter_delay = 8

  [[node.children]]
  kind = "text"
  text = "{p2.name}"
  anchor = "right"
  x = 20
  font = 2
  bank = 7
  scale = 2

# VS
[[node]]
kind = "text"
text = "VS"
anchor = "center"
y = -40
font = 3
bank = 0
scale = 6
enter = "fade"
enter_time = 30
enter_delay = 12
ease = "bounce"

# stage + countdown
[[node]]
kind = "panel"
dock = "bottom"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
anchor = "bottom"
y = 20
w = 520
h = 60
enter = "up"
enter_time = 20
enter_delay = 10

  [[node.children]]
  kind = "hbox"
  pad = 10
  gap = 16
  align = "center"
  justify = "center"

    [[node.children.children]]
    kind = "image"
    image = "{stage.thumb}"
    w = 70
    h = 40
    visible = "stage.has_thumb"

    [[node.children.children]]
    kind = "text"
    text = "{stage.name}"
    font = 2
    bank = 7
    scale = 2

    [[node.children.children]]
    kind = "text"
    text = "FIGHT IN {countdown}"
    font = 1
    bank = 4
    scale = 2

[[node]]
kind = "button"
dock = "right bottom"
id = "fight"
anchor = "br"
x = 40
y = 22
w = 220
h = 54
image = "ui/button_lit.webp"
image_focus = "ui/button_lit.webp"
text = "FIGHT"
font = 2
bank = 7
bank_focus = 4
scale = 2
on_press = "fight"
hover_scale = 1.04
