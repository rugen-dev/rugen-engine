# rugen character select — Brawlhalla-style roster. Coordinates are 1280x720.
# Data: title, prompt, room, cells[] (name thumb badge broken p1 p2 hover index),
# shown{name author art verdict badge stats present}, p1/p2 (same shape), versus,
# ready, searching, query, sort, count, stage{name thumb has_thumb}, profile, rating.
background = [0.03, 0.04, 0.08, 1.0]

[[node]]
kind = "image"
image = "ui/bg.webp"
w = 1280
h = 720

# header
[[node]]
kind = "text"
text = "{title}"
x = 40
y = 18
font = 3
bank = 0
scale = 2
enter = "down"

[[node]]
kind = "text"
text = "{prompt}"
anchor = "top"
y = 30
font = 2
bank = 4
scale = 2

[[node]]
kind = "text"
text = "ROOM {room}"
anchor = "tr"
x = 40
y = 30
font = 1
bank = 6
scale = 2

# big art plate (left)
[[node]]
kind = "panel"
id = "art"
image = "ui/art_frame.webp"
nine = [10, 10, 10, 10]
x = 40
y = 70
w = 400
h = 440
enter = "left"
enter_time = 20

  [[node.children]]
  kind = "image"
  image = "{shown.art}"
  anchor = "top"
  y = 14
  h = 400
  visible = "shown.present"

[[node]]
kind = "panel"
image = "ui/plate_lit.webp"
x = 40
y = 516
w = 442
h = 44
enter = "left"
enter_time = 22

  [[node.children]]
  kind = "text"
  text = "{shown.name}"
  anchor = "left"
  x = 20
  font = 2
  bank = 7
  scale = 2

[[node]]
kind = "text"
text = "BY {shown.author}"
x = 48
y = 568
font = 1
bank = 6
scale = 2

[[node]]
kind = "image"
image = "{shown.badge}"
x = 48
y = 594
w = 16
h = 16
visible = "shown.badge"

[[node]]
kind = "text"
text = "{shown.verdict}"
x = 72
y = 592
font = 1
bank = 4
scale = 2

[[node]]
kind = "text"
text = "{shown.stats}"
x = 48
y = 616
font = 1
bank = 7
scale = 2

[[node]]
kind = "text"
text = "P1  {p1.name}     P2  {p2.name}"
x = 48
y = 644
font = 1
bank = 6
scale = 2
visible = "versus"

# roster grid
[[node]]
kind = "grid"
id = "cells"
x = 470
y = 70
w = 772
h = 386
columns = 10
cell_w = 77
cell_h = 77
items = "cells"
enter = "right"
enter_time = 20

  [[node.children]]
  kind = "button"
  w = 76
  h = 76
  image = "ui/cell.webp"
  image_focus = "ui/cell_lit.webp"
  color_focus2 = [0.35, 0.55, 1.0, 0.45]
  on_press = "pick:{item.index}"

    [[node.children.children]]
    kind = "image"
    image = "{item.thumb}"
    x = 6
    y = 6
    w = 64
    h = 64
    visible = "item.thumb"

    [[node.children.children]]
    kind = "panel"
    color = [0.0, 0.0, 0.0, 0.65]
    x = 6
    y = 6
    w = 64
    h = 64
    visible = "item.broken"

    [[node.children.children]]
    kind = "image"
    image = "ui/cell_p1.webp"
    w = 76
    h = 76
    visible = "item.p1"

    [[node.children.children]]
    kind = "image"
    image = "ui/cell_p2.webp"
    w = 76
    h = 76
    visible = "item.p2"

    [[node.children.children]]
    kind = "image"
    image = "{item.badge}"
    anchor = "tr"
    x = 5
    y = 5
    w = 14
    h = 14
    visible = "item.badge"

# grid toolbar
[[node]]
kind = "text"
text = "{count}"
x = 474
y = 466
font = 1
bank = 6
scale = 2

[[node]]
kind = "input"
id = "search"
x = 748
y = 462
w = 130
h = 32
image = "ui/plate.webp"
image_focus = "ui/plate_lit.webp"
placeholder = "SEARCH"
value = "query"
max_len = 24
font = 1
bank = 7
scale = 2
pad = 10
on_change = "query:{value}"
tip = "TYPE TO FILTER THE ROSTER"

[[node]]
kind = "button"
id = "sort"
x = 886
y = 462
w = 214
h = 32
image = "ui/plate.webp"
image_focus = "ui/plate_lit.webp"
text = "SORT: {sort}"
font = 1
bank = 7
scale = 2
on_press = "sort"

[[node]]
kind = "button"
id = "random"
x = 1108
y = 462
w = 134
h = 32
image = "ui/plate.webp"
image_focus = "ui/plate_lit.webp"
text = "RANDOM"
font = 1
bank = 7
scale = 2
on_press = "random"

# stage strip
[[node]]
kind = "panel"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
x = 470
y = 508
w = 430
h = 130
enter = "up"
enter_time = 20

  [[node.children]]
  kind = "text"
  text = "STAGE"
  x = 14
  y = 10
  font = 1
  bank = 4
  scale = 2

  [[node.children]]
  kind = "image"
  image = "{stage.thumb}"
  x = 14
  y = 34
  w = 150
  h = 84
  visible = "stage.has_thumb"

  [[node.children]]
  kind = "panel"
  color = [0.08, 0.1, 0.18, 1.0]
  x = 14
  y = 34
  w = 150
  h = 84
  visible = "!stage.has_thumb"

  [[node.children]]
  kind = "text"
  text = "{stage.name}"
  x = 178
  y = 48
  w = 236
  font = 2
  bank = 7
  scale = 2

  [[node.children]]
  kind = "button"
  id = "stage_prev"
  x = 178
  y = 84
  w = 60
  h = 32
  image = "ui/plate.webp"
  image_focus = "ui/plate_lit.webp"
  text = "<"
  font = 2
  bank = 7
  scale = 2
  on_press = "stage:prev"

  [[node.children]]
  kind = "button"
  id = "stage_next"
  x = 246
  y = 84
  w = 60
  h = 32
  image = "ui/plate.webp"
  image_focus = "ui/plate_lit.webp"
  text = ">"
  font = 2
  bank = 7
  scale = 2
  on_press = "stage:next"

  [[node.children]]
  kind = "button"
  id = "stage_random"
  x = 314
  y = 84
  w = 100
  h = 32
  image = "ui/plate.webp"
  image_focus = "ui/plate_lit.webp"
  text = "RANDOM"
  font = 1
  bank = 7
  scale = 2
  on_press = "stage:random"

# player card
[[node]]
kind = "panel"
image = "ui/card.webp"
nine = [10, 10, 10, 10]
x = 920
y = 508
w = 322
h = 130
enter = "up"
enter_time = 20
enter_delay = 4

  [[node.children]]
  kind = "image"
  image = "{profile.avatar}"
  x = 12
  y = 12
  w = 56
  h = 56

  [[node.children]]
  kind = "text"
  text = "{profile.name}"
  x = 80
  y = 12
  font = 2
  bank = 7
  scale = 2

  [[node.children]]
  kind = "text"
  text = "LEVEL {profile.level}"
  x = 80
  y = 44
  font = 1
  bank = 4
  scale = 2

  [[node.children]]
  kind = "text"
  text = "{profile.wins} W / {profile.losses} L"
  x = 80
  y = 68
  font = 1
  bank = 6
  scale = 2

  [[node.children]]
  kind = "text"
  text = "RATING {rating}"
  x = 12
  y = 98
  font = 1
  bank = 7
  scale = 2

# confirm / back
[[node]]
kind = "button"
id = "confirm"
x = 470
y = 652
w = 300
h = 54
image = "ui/button_lit.webp"
image_focus = "ui/button_lit.webp"
text = "CONFIRM"
font = 2
bank = 7
bank_focus = 4
scale = 2
on_press = "confirm"
visible = "ready"
hover_scale = 1.03

[[node]]
kind = "button"
id = "back"
anchor = "br"
x = 40
y = 14
w = 200
h = 54
image = "ui/button.webp"
image_focus = "ui/button_lit.webp"
text = "BACK"
font = 2
bank = 7
bank_focus = 4
scale = 2
on_press = "back"
