# rugen options screen — rows come from the engine (`rows`), layout is yours.
background = [0.03, 0.04, 0.08, 1.0]

[[node]]
kind = "image"
image = "ui/bg.webp"
w = 1280
h = 720

[[node]]
kind = "text"
text = "OPTIONS"
anchor = "top"
y = 44
font = 3
bank = 0
scale = 2
enter = "down"

[[node]]
kind = "panel"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
x = 220
y = 130
w = 840
h = 540
pad = 24
enter = "up"
enter_time = 18

  [[node.children]]
  kind = "list"
  id = "rows"
  w = 792
  h = 420
  gap = 6
  items = "rows"

    [[node.children.children]]
    kind = "button"
    id = "{item.id}"
    h = 40
    image = "ui/row.webp"
    image_focus = "ui/row_lit.webp"
    on_press = "{item.press}"
    on_left = "{item.left}"
    on_right = "{item.right}"

      [[node.children.children.children]]
      kind = "text"
      text = "{item.label}"
      anchor = "left"
      x = 24
      font = 2
      bank = 7
      scale = 2

      [[node.children.children.children]]
      kind = "text"
      text = "{item.value}"
      anchor = "right"
      x = 28
      font = 2
      bank = 4
      scale = 2

  [[node.children]]
  kind = "button"
  id = "back"
  anchor = "bl"
  w = 220
  h = 54
  image = "ui/button.webp"
  image_focus = "ui/button_lit.webp"
  text = "BACK"
  font = 2
  bank = 7
  bank_focus = 4
  scale = 2
  on_press = "back"

  [[node.children]]
  kind = "text"
  text = "LEFT / RIGHT  CHANGE      ENTER  SELECT      SAVED ON EXIT"
  anchor = "br"
  x = 8
  y = 60
  font = 1
  bank = 6
  scale = 2

# key capture overlay
[[node]]
kind = "panel"
color = [0.0, 0.0, 0.0, 0.75]
visible = "capture.active"

  [[node.children]]
  kind = "text"
  text = "{capture.prompt}"
  anchor = "center"
  y = -20
  font = 2
  bank = 4
  scale = 3

  [[node.children]]
  kind = "text"
  text = "{capture.progress}     ESC  CANCEL"
  anchor = "center"
  y = 36
  font = 1
  bank = 7
  scale = 2
