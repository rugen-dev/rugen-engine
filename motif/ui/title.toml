# rugen title screen — edit freely, see README.md. Coordinates are 1280x720.
background = [0.02, 0.03, 0.07, 1.0]

# background: three pixel layers (sky, far ridges, near arena) that slide in
# at different speeds for a parallax feel
[[node]]
kind = "image"
image = "ui/bg_sky.webp"
w = 1280
h = 720
enter = "fade"
enter_time = 30

[[node]]
kind = "image"
image = "ui/bg_far.webp"
w = 1280
h = 720
enter = "up"
enter_time = 36

[[node]]
kind = "image"
image = "ui/bg_near.webp"
w = 1280
h = 720
enter = "up"
enter_time = 22

[[node]]
kind = "image"
id = "logo"
image = "ui/logo.webp"
x = 56
y = 30
scale = 2
enter = "down"
enter_time = 22

# profile strip
[[node]]
kind = "panel"
id = "profile"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
anchor = "tr"
x = 24
y = 22
w = 560
h = 76
enter = "right"
enter_time = 20

  [[node.children]]
  kind = "image"
  image = "{profile.avatar}"
  x = 10
  y = 10
  w = 56
  h = 56

  [[node.children]]
  kind = "text"
  text = "{profile.name}"
  x = 80
  y = 10
  font = 2
  bank = 7
  scale = 2

  [[node.children]]
  kind = "text"
  text = "LEVEL {profile.level}   {profile.shards} SHARDS   {profile.wins} W / {profile.losses} L"
  x = 80
  y = 46
  font = 1
  bank = 4
  scale = 2

# main menu: one slanted button per entry of `menu`
[[node]]
kind = "vbox"
id = "menu"
x = 60
y = 236
w = 400
gap = 10
items = "menu"
enter = "left"
enter_time = 20

  [[node.children]]
  kind = "button"
  id = "{item.id}"
  h = 54
  image = "ui/button.webp"
  image_focus = "ui/button_lit.webp"
  text = "{item.label}"
  font = 2
  bank = 7
  bank_focus = 4
  scale = 2
  align = "left"
  pad = 26
  hover_scale = 1.03
  on_press = "{item.action}"

# featured panel
[[node]]
kind = "panel"
image = "ui/panel.webp"
nine = [8, 8, 8, 8]
x = 500
y = 236
w = 500
h = 330
enter = "up"
enter_time = 22
enter_delay = 4

  [[node.children]]
  kind = "image"
  image = "{news.0.image}"
  x = 6
  y = 6
  w = 488
  h = 258

  [[node.children]]
  kind = "panel"
  color = [0.0, 0.0, 0.0, 0.6]
  anchor = "bl"
  x = 6
  y = 6
  w = 488
  h = 60

  [[node.children]]
  kind = "text"
  text = "{news.0.title}"
  anchor = "bl"
  x = 18
  y = 34
  font = 2
  bank = 7
  scale = 2

  [[node.children]]
  kind = "text"
  text = "{news.0.subtitle}"
  anchor = "bl"
  x = 18
  y = 12
  w = 460
  font = 1
  bank = 6
  scale = 2

