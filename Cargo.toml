[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Diary-Axel-RAKOTOARIVAO/RUGEN"
rust-version = "1.85"

[workspace.dependencies]
rugen-formats = { path = "crates/formats" }
rugen-cns = { path = "crates/cns" }
rugen-sim = { path = "crates/sim" }
rugen-net = { path = "crates/net" }
rugen-render = { path = "crates/render" }
rugen-audio = { path = "crates/audio" }

thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
bytemuck = { version = "1", features = ["derive"] }
fixed = "1"
indexmap = "2"
logos = "0.15"
png = "0.18"
ggrs = "0.11"
wgpu = "26"
winit = "0.30"
gilrs = "0.11"
kira = "0.10"
pollster = "0.4"

[workspace.lints.rust]
unsafe_code = "warn"
[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
[profile.dev.package."*"]
opt-level = 2
