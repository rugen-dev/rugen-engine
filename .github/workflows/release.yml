# Release builds for every platform (free tier). One job per OS, several
# targets per job (Windows / macOS runners bill 2x / 10x minutes).
#
# Started by hand from main with the tag to build:
#   gh workflow run release.yml --ref main -f tag=v0.6.2
# Running on main (not on the tag) lets each release reuse the previous one's
# dependency cache: GitHub never shares caches between tags.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: tag to build and publish (vX.Y.Z, already pushed)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}
  # official server baked into the game (BUILDING.md#official-server): set the
  # repository variables before releasing; the public key is required
  RUGEN_OFFICIAL_SERVER: ${{ vars.RUGEN_OFFICIAL_SERVER || 'https://play.rugen.dev' }}
  RUGEN_OFFICIAL_KEY: ${{ vars.RUGEN_OFFICIAL_KEY }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Official server key is set
        if: env.RUGEN_OFFICIAL_KEY == ''
        shell: bash
        run: echo "::error::set the RUGEN_OFFICIAL_KEY repository variable (rugen-server --gen-key)" && exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: reference/mugen-1.1b1
          key: mugen-1.1b1
      - name: MUGEN base data
        shell: bash
        run: reference/fetch.sh mugen && scripts/stage-data.sh
      - name: Build and package
        shell: bash
        run: |
          v=${TAG#v}
          for pair in x86_64-pc-windows-msvc:x64 i686-pc-windows-msvc:x86 aarch64-pc-windows-msvc:arm64; do
            target=${pair%%:*}; arch=${pair##*:}
            cargo build --release -p rugen --bin rugen --target $target
            d=dist-$arch; mkdir -p $d/chars $d/stages
            cp README.md LICENSE-MIT LICENSE-APACHE $d/
            cp -r motif $d/
            cp chars/README.md $d/chars/; cp stages/README.md $d/stages/
            cp target/$target/release/rugen.exe $d/
            cp -r dist/pkgdata $d/data
            (cd $d && 7z a ../rugen-$v-windows-$arch.zip . > /dev/null)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rugen-*.zip

  linux:
    # the oldest runner keeps the binary on an old glibc (2.34+ supported)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Official server key is set
        if: env.RUGEN_OFFICIAL_KEY == ''
        shell: bash
        run: echo "::error::set the RUGEN_OFFICIAL_KEY repository variable (rugen-server --gen-key)" && exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: reference/mugen-1.1b1
          key: mugen-1.1b1
      - name: MUGEN base data
        shell: bash
        run: reference/fetch.sh mugen && scripts/stage-data.sh
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev libasound2-dev
      - run: cargo build --release -p rugen --bin rugen
      - name: Runs on glibc 2.34+
        run: |
          need=$(objdump -T target/release/rugen | grep -v ' w ' | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -1)
          echo "needs $need"
          [ "$(printf '%s\nGLIBC_2.34\n' "$need" | sort -V | tail -1)" = GLIBC_2.34 ]
      - name: Portable tarball
        run: |
          v=${TAG#v}
          d=rugen-$v-linux-x86_64; mkdir -p $d/chars $d/stages
          cp README.md LICENSE-MIT LICENSE-APACHE packaging/rugen.desktop $d/
          cp -r motif $d/
          cp chars/README.md $d/chars/; cp stages/README.md $d/stages/
          cp target/release/rugen $d/
          cp -r dist/pkgdata $d/data
          tar -czf $d.tar.gz $d
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: .deb and .rpm
        run: |
          cargo deb -p rugen --no-build
          cargo generate-rpm -p crates/app
          cp target/debian/*.deb target/generate-rpm/*.rpm .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            rugen-*.tar.gz
            *.deb
            *.rpm

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Official server key is set
        if: env.RUGEN_OFFICIAL_KEY == ''
        shell: bash
        run: echo "::error::set the RUGEN_OFFICIAL_KEY repository variable (rugen-server --gen-key)" && exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: reference/mugen-1.1b1
          key: mugen-1.1b1
      - name: MUGEN base data
        shell: bash
        run: reference/fetch.sh mugen && scripts/stage-data.sh
      - name: Build and package
        run: |
          v=${TAG#v}
          for pair in aarch64-apple-darwin:arm64 x86_64-apple-darwin:x64; do
            target=${pair%%:*}; arch=${pair##*:}
            cargo build --release -p rugen --bin rugen --target $target
            d=rugen-$v-macos-$arch; mkdir -p $d/chars $d/stages
            cp README.md LICENSE-MIT LICENSE-APACHE $d/
            cp -r motif $d/
            cp chars/README.md $d/chars/; cp stages/README.md $d/stages/
            cp target/$target/release/rugen $d/
            cp -r dist/pkgdata $d/data
            tar -czf $d.tar.gz $d
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: rugen-*.tar.gz

  publish:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Release notes
        run: |
          v=${TAG#v}
          url=https://github.com/${{ github.repository }}/releases/download/$TAG
          link() { f=$(ls $1 | head -1); echo "[\`$f\`]($url/$f)"; }
          cat > notes.md <<NOTES
          ## Downloads

          ### Windows

          | Version | File |
          |---|---|
          | 64-bit (x64), most PCs | $(link "rugen-$v-windows-x64.zip") |
          | 32-bit (x86), older PCs | $(link "rugen-$v-windows-x86.zip") |
          | ARM64 (Snapdragon / Copilot+ PCs) | $(link "rugen-$v-windows-arm64.zip") |

          Unzip anywhere and run \`rugen.exe\`. Fighters go in \`chars/\`, stages in \`stages/\`.

          ### Linux (x86_64)

          | Package | File |
          |---|---|
          | Fedora / RHEL / openSUSE (.rpm) | $(link "rugen-$v-*.rpm") |
          | Debian / Ubuntu / Mint (.deb) | $(link "rugen_$v-*.deb") |
          | Any distro, portable (.tar.gz) | $(link "rugen-$v-linux-x86_64.tar.gz") |

          Packages install the game for every user; fighters and stages then go in
          \`~/.local/share/rugen/chars\` and \`~/.local/share/rugen/stages\`.
          The tarball is a self-contained folder like the Windows zip.

          ### macOS

          | Mac | File |
          |---|---|
          | Apple Silicon (M1 and later) | $(link "rugen-$v-macos-arm64.tar.gz") |
          | Intel | $(link "rugen-$v-macos-x64.tar.gz") |

          Unsigned: the first time, right-click \`rugen\` → Open (or \`xattr -dr com.apple.quarantine <folder>\`).

          Online hub: [rugen-server](https://github.com/rugen-dev/rugen-server) ·
          Docs: https://rugen.dev
          NOTES
          sed -i 's/^          //' notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: rugen ${{ inputs.tag }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            rugen-*.zip
            rugen-*.tar.gz
            *.deb
            *.rpm
