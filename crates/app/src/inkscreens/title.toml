# rugen HOME — Shonen Ink theme (UI book P.01). Coordinates are 1280x720.
# Data: menu[] {id label action desc exit right}, featured {name art present},
# arenas {name line counts}, vol, ranked {rating line}, profile, keys.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/home_bg.webp"
w = "100%"
h = "100%"

# logo: ink word, red offset shadow, brush underline, katakana accent
[[node]]
kind = "image"
dock = "left"
image = "ui/logo_home.webp"
x = 52
y = 10
angle = -3
enter = "down"
enter_time = 18
ease = "back"

[[node]]
kind = "text"
dock = "left"
text = "{vol}"
x = 64
y = 166
h = 34
pad = 12
image = "ui/stamp9.webp"
nine = [6, 6, 6, 6]
font = 1
scale = 2
bank = 10
angle = -3
enter = "fade"
enter_delay = 10

[[node]]
kind = "text"
dock = "left"
text = "{arenas.counts}"
x = 236
y = 174
font = 2
bank = 9
enter = "fade"
enter_delay = 14

# menu: the focused slab grows, turns red, gets a "!!" and its description
[[node]]
kind = "vbox"
dock = "left"
id = "menu"
x = 48
y = 208
w = 540
gap = 2
items = "menu"
stagger = 2
enter = "left"
enter_time = 16

  [[node.children]]
  kind = "image"
  image = "ui/slab_home_shadow.webp"
  x = 8
  y = 8
  w = 500
  h = 46
  when = "focus"
  visible = "!item.exit"

  [[node.children]]
  kind = "button"
  id = "slab"
  w = 440
  h = 34
  w_focus = 500
  h_focus = 46
  image = "ui/slab_home.webp"
  image_focus = "ui/slab_home_lit.webp"
  text = "{item.label}"
  font = 1
  scale = 2
  scale_focus = 3
  bank = 11
  bank_focus = 11
  align = "left"
  pad = 42
  on_press = "{item.action}"
  on_right = "{item.right}"
  visible = "!item.exit"

  [[node.children]]
  kind = "text"
  text = "▶"
  x = 12
  h = 46
  font = 1
  scale = 3
  bank = 11
  when = "focus"
  visible = "!item.exit"

  [[node.children]]
  kind = "text"
  text = "{item.desc}"
  x = 40
  y = 52
  font = 2
  bank = 9
  when = "focus"

  [[node.children]]
  kind = "button"
  id = "exit"
  w = 200
  h = 30
  w_focus = 240
  h_focus = 36
  image = "ui/slab_exit.webp"
  image_focus = "ui/slab_exit_lit.webp"
  text = "{item.label}"
  font = 1
  scale = 2
  bank = 9
  bank_focus = 11
  align = "left"
  pad = 30
  on_press = "{item.action}"
  visible = "item.exit"

# featured fighter: big slanted manga panel
[[node]]
kind = "panel"
dock = "right"
x = 600
y = 40
w = 648
h = 408
enter = "right"
enter_time = 18

  [[node.children]]
  kind = "image"
  image = "ui/feat_back.webp"
  w = 648
  h = 408

  [[node.children]]
  kind = "image"
  image = "{featured.art}"
  x = 286
  y = 8
  w = 336
  h = 392
  fit = "contain"
  fit_y = 1
  visible = "featured.present"

  [[node.children]]
  kind = "image"
  image = "ui/feat_frame.webp"
  w = 648
  h = 408

  [[node.children]]
  kind = "image"
  image = "ui/bubble_new.webp"
  x = 42
  y = 24
  visible = "featured.present"

  [[node.children]]
  kind = "text"
  text = "{featured.name}"
  x = 40
  y = 282
  h = 64
  pad = 26
  color = [0.07, 0.07, 0.07, 1.0]
  font = 1
  scale = 4
  bank = 11
  angle = -4
  visible = "featured.present"

  [[node.children]]
  kind = "hbox"
  x = 70
  y = 352
  w = 560
  h = 20
  gap = 10
  align = "center"
  visible = "featured.present"

    [[node.children.children]]
    kind = "text"
    text = "PRESS ▶ TO TRY"
    font = 2
    bank = 10

  [[node.children]]
  kind = "text"
  text = "{arenas.drop}"
  x = 70
  y = 190
  font = 2
  bank = 9
  visible = "!featured.present"

