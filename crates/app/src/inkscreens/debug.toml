# rugen DEBUG — Shonen Ink theme. The fighter debugger's panel around a
# running match (`rugen debug <fighter>`). Coordinates are 1280x720.
# The engine draws the fight inside the node with id "view" (keep it
# transparent: everything else is drawn over the fight).
# Data: title status paused running play speed boxes back can_back who
# state where kv[] {t} vars[] {t changed same} has_vars no_vars
# ctrls_title ctrls[] {ok no skip hl plain mark text note} has_ctrls
# no_ctrls keys. Actions: dbg:play dbg:step dbg:back dbg:speed dbg:boxes
# dbg:next dbg:view (a click on the fight picks the player under it).
background = [0.078, 0.071, 0.063, 1.0]

# ---------------------------------------------------------------- top bar
[[node]]
kind = "text"
text = "{title}"
x = 18
y = 14
font = 2
bank = 11

[[node]]
kind = "panel"
x = 470
y = 10
w = 264
h = 26
color = [0.784, 0.063, 0.102, 1.0]
visible = "paused"

  [[node.children]]
  kind = "text"
  text = "{status}"
  anchor = "center"
  font = 1
  bank = 11

[[node]]
kind = "panel"
x = 470
y = 10
w = 264
h = 26
outline = [1.0, 1.0, 1.0, 1.0]
outline_w = 2
visible = "running"

  [[node.children]]
  kind = "text"
  text = "{status}"
  anchor = "center"
  font = 1
  bank = 11

# ---------------------------------------------------------------- the fight
[[node]]
kind = "button"
id = "view"
x = 14
y = 46
w = 720
h = 606
outline = [1.0, 1.0, 1.0, 1.0]
outline_w = 3
on_press = "dbg:view"

