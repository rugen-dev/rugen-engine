# rugen RESULT — Shonen Ink theme (UI book P.06). Coordinates are 1280x720.
# Data: winner, winner_line (NAME WINS), winner_big / winner_small, winner_art, has_art, draw, quote, stats[] {label value},
# loser {name art has_art}, menu[] {id label action}, rounds, rating.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/result_bg.webp"
w = "100%"
h = "100%"

[[node]]
kind = "image"
dock = "left bottom"
image = "{winner_art}"
x = 60
y = 118
w = 516
h = 602
fit = "contain"
fit_y = 1
visible = "has_art"
enter = "left"
enter_time = 16

[[node]]
kind = "image"
dock = "left"
image = "ui/win.webp"
x = 40
y = 34
angle = -5
visible = "!draw"
enter = "down"
enter_time = 14
ease = "back"

[[node]]
kind = "text"
dock = "left"
text = "DRAW"
x = 40
y = 40
font = 1
scale = 8
bank = 11
angle = -5
visible = "draw"

[[node]]
kind = "panel"
dock = "left"
x = 470
y = 150
w = 300
h = 160
visible = "!draw"
enter = "fade"
enter_delay = 10

  [[node.children]]
  kind = "image"
  image = "ui/bubble_quote.webp"
  w = 300
  h = 160

  [[node.children]]
  kind = "text"
  text = "{quote}"
  x = 34
  y = 18
  w = 232
  h = 92
  wrap = true
  line_h = 22
  align = "center"
  font = 2
  bank = 9

# who won, on the slab under the portrait (smaller for long names)
[[node]]
kind = "text"
dock = "left"
text = "{winner_line}"
x = 40
y = 620
h = 64
pad = 26
color = [0.07, 0.07, 0.07, 1.0]
outline = [1.0, 1.0, 1.0, 1.0]
outline_w = 4
font = 1
scale = 4
bank = 11
angle = -3
visible = "winner_big"
enter = "left"
enter_time = 14
enter_delay = 6

[[node]]
kind = "text"
dock = "left"
text = "{winner_line}"
x = 40
y = 636
h = 48
pad = 26
color = [0.07, 0.07, 0.07, 1.0]
outline = [1.0, 1.0, 1.0, 1.0]
outline_w = 4
font = 1
scale = 2
bank = 11
angle = -3
visible = "winner_small"
enter = "left"
enter_time = 14
enter_delay = 6

# match report
[[node]]
kind = "panel"
dock = "right"
x = 800
y = 60
w = 438
h = 408
enter = "right"
enter_time = 16

  [[node.children]]
  kind = "image"
  image = "ui/report_panel.webp"
  w = 438
  h = 408

  [[node.children]]
  kind = "text"
  text = "MATCH REPORT"
  x = 24
  y = 22
  font = 1
  scale = 2
  bank = 10

  [[node.children]]
  kind = "vbox"
  x = 24
  y = 60
  w = 382
  gap = 12
  items = "stats"
  stagger = 2

    [[node.children.children]]
    kind = "panel"
    w = 382
    h = 34

      [[node.children.children.children]]
      kind = "text"
      text = "{item.label}"
      h = 28
      font = 1
      scale = 2
      bank = 9

      [[node.children.children.children]]
      kind = "text"
      text = "{item.value}"
      w = 382
      h = 28
      align = "right"
      font = 1
      scale = 2
      bank = 9

      [[node.children.children.children]]
      kind = "image"
      image = "ui/dots.webp"
      y = 30
      w = 382
      h = 4

  [[node.children]]
  kind = "image"
  image = "{loser.art}"
  x = 230
  y = 316
  w = 64
  h = 64
  fit = "cover"
  fit_y = 0.1
  grey = true
  outline = [0.07, 0.07, 0.07, 1.0]
  visible = "loser.has_art"

  [[node.children]]
  kind = "text"
  text = "LOSE"
  x = 306
  y = 330
  h = 34
  pad = 10
  image = "ui/stamp9.webp"
  nine = [6, 6, 6, 6]
  font = 1
  scale = 2
  bank = 10
  angle = -8
  visible = "!draw"

# buttons
[[node]]
kind = "vbox"
dock = "right"
id = "menu"
x = 800
y = 496
w = 440
gap = 12
items = "menu"
stagger = 2
enter = "up"
enter_time = 14

  [[node.children]]
  kind = "button"
  id = "slab"
  w = 390
  h = 44
  w_focus = 430
  h_focus = 52
  image = "ui/slab_result.webp"
  image_focus = "ui/slab_result_lit.webp"
  text = "{item.label}"
  font = 1
  scale = 2
  bank = 11
  bank_focus = 11
  align = "left"
  pad = 40
  on_press = "{item.action}"

  [[node.children]]
  kind = "text"
  text = "▶"
  x = 14
  h = 52
  font = 1
  scale = 2
  bank = 11
  when = "focus"
