# rugen CHARACTER SELECT — Shonen Ink theme (UI book P.02, big-roster layout).
# Coordinates are 1280x720. 12 x 5 cells of 64 px per page; past 60 fighters the
# grid pages (`paged`), PAGE n / N comes from `pages.grid`.
# Data: title, prompt, grid[] {index kind press name face has_face warn broken
# random empty p1 p2}, roster_line, filter, card1/card2 {name_up name_big name_small author portrait
# status ok bad record picked cpu present}, stage {name thumb has_thumb index count},
# ready, query, sort, keys {a b start}.
background = [0.95, 0.94, 0.89, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/sel_bg.webp"
w = "100%"
h = "100%"

# header band
[[node]]
kind = "panel"
dock = "top"
x = 0
y = 0
w = "100%"
h = 56
color = [0.07, 0.07, 0.07, 1.0]
enter = "down"
enter_time = 12

  [[node.children]]
  kind = "text"
  text = "{title}"
  x = 30
  y = 12
  font = 1
  scale = 3
  bank = 11

  [[node.children]]
  kind = "text"
  text = "{prompt}"
  x = 300
  y = 10
  h = 36
  pad = 30
  skew = 18
  color = [0.88, 0.13, 0.13, 1.0]
  font = 1
  scale = 2
  bank = 11

  [[node.children]]
  kind = "hbox"
  dock = "right"
  x = 780
  y = 13
  w = 472
  h = 30
  gap = 10
  justify = "end"
  align = "center"

    [[node.children.children]]
    kind = "text"
    text = "TAB"
    h = 26
    pad = 8
    image = "ui/key9_dark.webp"
    text_dy = -3
    nine = [4, 4, 4, 8]
    font = 2
    bank = 11

    [[node.children.children]]
    kind = "text"
    text = "SEARCH  "
    font = 2
    bank = 11

    [[node.children.children]]
    kind = "text"
    text = "F1"
    h = 26
    pad = 8
    image = "ui/key9_dark.webp"
    text_dy = -3
    nine = [4, 4, 4, 8]
    font = 2
    bank = 11

    [[node.children.children]]
    kind = "text"
    text = "SORT: {sort}"
    font = 2
    bank = 11

# roster grid: 12 x 5 cells, 64 px with 8 px gaps, paged
[[node]]
kind = "grid"
id = "grid"
x = 204
y = 84
w = 856
h = 352
columns = 12
cell_w = 64
cell_h = 64
gap = 8
paged = true
bleed = 40
items = "grid"
enter = "fade"
enter_time = 14

  [[node.children]]
  kind = "button"
  w = 64
  h = 64
  image = "ui/cell_{item.kind}.webp"
  on_press = "{item.press}"

    [[node.children.children]]
    kind = "image"
    image = "{item.face}"
    x = 4
    y = 4
    w = 56
    h = 56
    fit = "cover"
    fit_y = 0.12
    visible = "item.face_ok"

    [[node.children.children]]
    kind = "image"
    image = "{item.face}"
    x = 4
    y = 4
    w = 56
    h = 56
    fit = "cover"
    fit_y = 0.12
    grey = true
    alpha = 0.6
    visible = "item.face_grey"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_x.webp"
    w = 64
    h = 64
    visible = "item.broken"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_warn.webp"
    anchor = "tr"
    w = 26
    h = 26
    visible = "item.warn"

    [[node.children.children]]
    kind = "text"
    text = "1P"
    anchor = "bl"
    h = 22
    pad = 3
    color = [0.88, 0.13, 0.13, 1.0]
    font = 2
    bank = 11
    visible = "item.p1"

    [[node.children.children]]
    kind = "text"
    text = "2P"
    anchor = "br"
    h = 22
    pad = 3
    color = [0.07, 0.07, 0.07, 1.0]
    font = 2
    bank = 11
    visible = "item.p2"

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_cur1.webp"
    x = -6
    y = -30
    w = 76
    h = 100
    when = "focus"
    top = true

    [[node.children.children]]
    kind = "image"
    image = "ui/sel_cur2.webp"
    x = -6
    y = -6
    w = 76
    h = 100
    when = "focus2"
    top = true

# roster facts under the grid
[[node]]
kind = "text"
text = "{roster_line}"
x = 204
y = 446
font = 2
bank = 9
visible = "!ready"

[[node]]
kind = "text"
text = "PAGE {pages.grid.page} / {pages.grid.count}"
x = 860
y = 446
w = 200
align = "right"
font = 2
bank = 9
visible = "!searching"

# Tab search: a key-cap box while typing (arrows / Enter close it, Esc clears)
[[node]]
kind = "panel"
x = 592
y = 438
w = 240
h = 32
image = "ui/key9.webp"
nine = [4, 4, 4, 8]
visible = "searching"

[[node]]
kind = "text"
text = "ESC CLEARS"
x = 840
y = 446
font = 2
bank = 10
visible = "searching"

[[node]]
kind = "input"
id = "search"
x = 604
y = 446
w = 220
h = 24
focus = false
placeholder = ""
max_len = 16
font = 2
bank = 9
on_change = "query:{value}"

