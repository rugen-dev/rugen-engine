# rugen TEAM MODE — Shonen Ink theme (roadmap mockup "v2 · Team mode step").
# Coordinates are 1280x720. VS MODE / WATCH → TEAM MODE → fighter select.
# ←→ mode, ↑↓ team size (2-4), A / Enter READY, B / Esc back (un-ready first).
# The players drive the step; clicks send tm:<side>:<mode> / size:<side>:<n>.
# Data: title note p1/p2 {tag status ready choosing active idle title rules next
# cards[] {name desc press plain lit chosen dim show_sizes pix[] {x y w h main red
# white mute} sizes[] {label on off press}} slots[]}, keys, hint.
background = [0.95, 0.93, 0.89, 1.0]
exit_time = 8

