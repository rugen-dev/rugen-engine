# rugen PRACTICE — Dojo theme (restyled from the ink screen: same nodes and binds).
# Coordinates are 1280x720. Title menu → PRACTICE → TRAINING / WATCH / DEBUGGER.
# ◀ ▶ choose a card, A / Enter opens its fighter select, B / Esc back to the title.
# Data: cards[] {id title desc rows[] {name text hot cold} chip_l chip_r new action},
# note, profile, keys, hint.
# Jersey for text (font 2 small, 6 body, 3 big); banks 12 sumi, 13 vermilion,
# 14 washi, 16 brass, 17 soft sumi.
background = [0.078, 0.051, 0.043, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/hall.webp"
w = "100%"
h = "100%"

[[node]]
kind = "hbox"
x = 48
y = 26
w = 1184
h = 56
align = "end"
gap = 18
enter = "down"
enter_time = 12

  [[node.children]]
  kind = "text"
  text = "TITLE ▶"
  font = 2
  bank = 16
  text_dy = -6

  [[node.children]]
  kind = "text"
  text = "PRACTICE"
  font = 3
  bank = 14
  text_dy = 2

  [[node.children]]
  kind = "text"
  text = "LEARN, WATCH, DEBUG"
  font = 2
  bank = 16
  text_dy = -6

# the three cards: the focused card is the lit sheet in a brass edge over a vermilion shadow
[[node]]
kind = "hbox"
id = "cards"
x = 48
y = 108
w = 1184
h = 500
gap = 26
items = "cards"
stagger = 3
enter = "up"
enter_time = 16

  [[node.children]]
  kind = "panel"
  x = 10
  y = 10
  w = 377
  h = 500
  color = [0.204, 0.122, 0.078, 1.0]
  when = "blur"

  [[node.children]]
  kind = "panel"
  x = 10
  y = 10
  w = 377
  h = 500
  color = [0.706, 0.188, 0.102, 1.0]
  when = "focus"

  [[node.children]]
  kind = "button"
  id = "card"
  w = 377
  h = 500
  image = "ui/sheet9.webp"
  image_focus = "ui/sheet9_lit.webp"
  nine = [12, 12, 12, 12]
  border = 4
  border_color = [0.0, 0.0, 0.0, 0.0]
  border_color_focus = [0.89, 0.702, 0.298, 1.0]
  on_press = "{item.action}"

    [[node.children.children]]
    kind = "text"
    text = "{item.title}"
    x = 24
    y = 26
    font = 3
    bank = 12
    bank_focus = 13
    inherit_focus = true

    [[node.children.children]]
    kind = "text"
    text = "NEW"
    x = 291
    y = 30
    w = 62
    h = 28
    align = "center"
    color = [0.706, 0.188, 0.102, 1.0]
    font = 2
    bank = 14
    visible = "item.new"

    [[node.children.children]]
    kind = "text"
    text = "{item.desc}"
    x = 24
    y = 92
    w = 329
    wrap = true
    line_h = 28
    font = 6
    bank = 12

    # what the pause menu holds (TRAINING): a framed line per tool
    [[node.children.children]]
    kind = "vbox"
    x = 24
    y = 180
    w = 329
    h = 220
    gap = 8
    items = "item.rows"

      [[node.children.children.children]]
      kind = "panel"
      w = 329
      h = 58
      deck = { h = 62 }
      color = [0.976, 0.949, 0.886, 0.6]
      border = 3
      border_color = [0.706, 0.188, 0.102, 1.0]
      visible = "item.hot"

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.name}"
        x = 10
        y = 6
        h = 20
        font = 2
        bank = 13

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.text}"
        x = 10
        y = 30
        w = 309
        h = 20
        deck = { y = 32, h = 24 }
        font = 2
        bank = 17

      [[node.children.children.children]]
      kind = "panel"
      w = 329
      h = 58
      deck = { h = 62 }
      color = [0.976, 0.949, 0.886, 0.6]
      border = 3
      border_color = [0.204, 0.122, 0.078, 1.0]
      visible = "item.cold"

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.name}"
        x = 10
        y = 6
        h = 20
        font = 2
        bank = 12

        [[node.children.children.children.children]]
        kind = "text"
        text = "{item.text}"
        x = 10
        y = 30
        w = 309
        h = 20
        deck = { y = 32, h = 24 }
        font = 2
        bank = 17

    [[node.children.children]]
    kind = "panel"
    x = 24
    y = 414
    w = 329
    h = 62
    color = [0.133, 0.078, 0.059, 1.0]

    [[node.children.children]]
    kind = "text"
    text = "{item.chip_l}"
    x = 36
    y = 416
    h = 30
    font = 2
    bank = 14

    [[node.children.children]]
    kind = "text"
    text = "{item.chip_r}"
    x = 36
    y = 444
    w = 305
    h = 30
    align = "right"
    font = 2
    bank = 14

[[node]]
kind = "text"
text = "{note}"
x = 48
y = 652
h = 36
font = 2
bank = 16

[[node]]
