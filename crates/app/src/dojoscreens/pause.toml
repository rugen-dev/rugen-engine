# rugen PAUSE — Dojo theme (layout of the approved "Pause and move list" mockup).
# Coordinates are 1280x720. The fight stays visible, dimmed; the menu sits
# on the left, the move list of the fighter who paused on a washi sheet.
# Data: scene/has_scene (the frozen fight), menu[] {id label action}, who,
# name, title, title_big, col1[] / col2[] rows {group label | name cost
# parts[] {text cap}}, has_moves, no_moves, empty, source, facing, paged,
# keys {start}.
background = [0.078, 0.051, 0.043, 1.0]
exit_time = 6

[[node]]
kind = "image"
fit = "cover"
image = "{scene}"
w = "100%"
h = "100%"
visible = "has_scene"

# dim, not black: the fight stays readable under the menu
[[node]]
kind = "panel"
w = "100%"
h = "100%"
color = [0.078, 0.051, 0.043, 0.45]

# ------------------------------------------------------------------ menu
[[node]]
kind = "panel"
dock = "left"
x = 48
y = 40
w = 344
h = 560
enter = "left"
enter_time = 10

  [[node.children]]
  kind = "text"
  text = "PAUSE"
  font = 3
  scale = 2
  bank = 14

  [[node.children]]
  kind = "text"
  text = "{who}"
  y = 64
  font = 2
  bank = 16

  [[node.children]]
  kind = "vbox"
  id = "menu"
  y = 108
  w = 344
  gap = 7
  items = "menu"
  stagger = 2

    # fixed slot so the list never shifts with the focus
    [[node.children.children]]
    kind = "panel"
    w = 344
    h = 57

    [[node.children.children]]
    kind = "button"
    id = "slab"
    w = 320
    h = 50
    w_focus = 340
    h_focus = 54
    image = "ui/plaque9.webp"
    image_focus = "ui/plaque9_lit.webp"
    nine = [8, 8, 8, 10]
    text = "{item.label}"
    font = 6
    bank = 14
    bank_focus = 14
    align = "left"
    pad = 22
    on_press = "{item.action}"
    on_left = "page:-1"
    on_right = "page:1"

