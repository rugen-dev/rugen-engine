# rugen HOME — Dojo theme. Coordinates are 1280x720.
# Data: menu[] {id label action desc exit right}, featured {name art present},
# arenas {name line counts}, ranked {title rating line}, profile, keys.
# Fonts: 6 body (Jersey 30), 2 captions (Jersey 20), 1 / 4 Press Start for
# key caps and numbers. Banks: 12 sumi, 13 vermilion, 14 washi, 15 brass,
# 16 muted on lacquer, 17 soft sumi on washi.
background = [0.078, 0.051, 0.043, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/hall_title.webp"
w = "100%"
h = "100%"

# logo: carved seal, RUGEN in washi, vermilion brush stroke
[[node]]
kind = "image"
dock = "left"
image = "ui/logo.webp"
x = 56
y = 40
enter = "down"
enter_time = 18
ease = "back"

[[node]]
kind = "text"
dock = "left"
text = "{arenas.counts}"
x = 144
y = 140
font = 2
bank = 16
enter = "fade"
enter_delay = 12

# menu: wooden plaques; the focused one turns vermilion with a brass edge,
# grows and shows its description under it
[[node]]
kind = "vbox"
dock = "left"
id = "menu"
x = 56
y = 182
w = 470
gap = 4
items = "menu"
stagger = 2
enter = "left"
enter_time = 16

  [[node.children]]
  kind = "button"
  id = "slab"
  w = 400
  h = 34
  w_focus = 440
  h_focus = 46
  image = "ui/plaque9.webp"
  image_focus = "ui/plaque9_lit.webp"
  nine = [8, 8, 8, 10]
  text = "{item.label}"
  font = 6
  bank = 14
  bank_focus = 14
  align = "left"
  pad = 40
  on_press = "{item.action}"
  on_right = "{item.right}"
  visible = "!item.exit"

  # a brass stud on the focused plaque
  [[node.children]]
  kind = "panel"
  x = 16
  y = 17
  w = 12
  h = 12
  color = [0.89, 0.702, 0.298, 1.0]
  border = 2
  border_color = [0.078, 0.051, 0.043, 1.0]
  when = "focus"
  visible = "!item.exit"

  [[node.children]]
  kind = "text"
  text = "{item.desc}"
  x = 40
  y = 50
  font = 2
  bank = 16
  when = "focus"

  [[node.children]]
  kind = "button"
  id = "exit"
  w = 200
  h = 30
  w_focus = 240
  h_focus = 38
  image = "ui/plaque9_dark.webp"
  image_focus = "ui/plaque9_lit.webp"
  nine = [8, 8, 8, 10]
  text = "{item.label}"
  font = 6
  bank = 16
  bank_focus = 14
  align = "left"
  pad = 30
  on_press = "{item.action}"
  visible = "item.exit"

