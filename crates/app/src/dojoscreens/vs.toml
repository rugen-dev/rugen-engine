# rugen VERSUS — Dojo theme. Coordinates are 1280x720.
# Data: p1/p2 {name name_up art has_art team}, stage {name thumb has_thumb}, countdown.
# The hall split by a pillar: P1's half in vermilion light, P2's in brass,
# the VS seal on the pillar inside an ensō.
background = [0.078, 0.051, 0.043, 1.0]
exit_time = 8

[[node]]
kind = "image"
fit = "cover"
image = "ui/hall_vs.webp"
w = "100%"
h = "100%"

[[node]]
