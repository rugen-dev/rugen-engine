[package]
name = "rugen"
description = "MUGEN-compatible 2D fighting game engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rugen-formats.workspace = true
rugen-cns.workspace = true
rugen-sim.workspace = true
rugen-net.workspace = true
rugen-fair.workspace = true
rugen-proto.workspace = true
rugen-render.workspace = true
rugen-audio.workspace = true
rugen-content.workspace = true
winit.workspace = true
gilrs.workspace = true
pollster.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
png.workspace = true
libm.workspace = true
ab_glyph = "0.2"
image-webp = "0.2"
rugen-ui.workspace = true
# COPY CODE / paste a room code (text only; Wayland via data-control)
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

[package.metadata.deb]
name = "rugen"
maintainer = "rugen-dev <https://github.com/rugen-dev>"
section = "games"
extended-description = """\
MUGEN-compatible 2D fighting game engine with rollback netplay. \
Put characters and stages (.zip / .rar / .rgc / .rgs) in \
~/.local/share/rugen/chars and ~/.local/share/rugen/stages."""
# explicit: `$auto` needs dpkg-shlibdeps, which the (Fedora) release machine
# lacks, and then ships no Depends at all. glibc 2.34+ (see glibc_compat.rs).
depends = "libc6 (>= 2.34), libgcc-s1, libasound2t64 | libasound2, libudev1"
assets = [
  ["target/release/rugen", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/rugen/README.md", "644"],
  ["../../LICENSE-MIT", "usr/share/doc/rugen/", "644"],
  ["../../LICENSE-APACHE", "usr/share/doc/rugen/", "644"],
  ["../../packaging/rugen.desktop", "usr/share/applications/", "644"],
  ["../../motif/brand/rugen.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
  ["../../motif/**/*", "usr/share/rugen/motif/", "644"],
  # MUGEN base data (common1.cns, sparks, sounds): scripts/stage-data.sh
  ["../../dist/pkgdata/*", "usr/share/rugen/data/", "644"],
]

[package.metadata.generate-rpm]
summary = "MUGEN-compatible 2D fighting game engine"
license = "MIT OR Apache-2.0"
# explicit requires: the automatic ones ask for libc.so.6(GLIBC_2.39) from
# weak symbols the binary does without (glibc 2.34+, see glibc_compat.rs);
# library capabilities rather than package names work on Fedora and openSUSE
auto-req = "no"
assets = [
  { source = "target/release/rugen", dest = "/usr/bin/rugen", mode = "755" },
  { source = "LICENSE-MIT", dest = "/usr/share/licenses/rugen/LICENSE-MIT", mode = "644", doc = true },
  { source = "LICENSE-APACHE", dest = "/usr/share/licenses/rugen/LICENSE-APACHE", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/rugen/README.md", mode = "644", doc = true },
  { source = "packaging/rugen.desktop", dest = "/usr/share/applications/rugen.desktop", mode = "644" },
  { source = "motif/brand/rugen.png", dest = "/usr/share/icons/hicolor/256x256/apps/rugen.png", mode = "644" },
  { source = "motif/**/*", dest = "/usr/share/rugen/motif/", mode = "644" },
  # MUGEN base data (common1.cns, sparks, sounds): scripts/stage-data.sh
  { source = "dist/pkgdata/*", dest = "/usr/share/rugen/data/", mode = "644" },
]
[package.metadata.generate-rpm.requires]
"libc.so.6(GLIBC_2.34)(64bit)" = "*"
"libm.so.6()(64bit)" = "*"
"libgcc_s.so.1()(64bit)" = "*"
"libasound.so.2()(64bit)" = "*"
"libudev.so.1()(64bit)" = "*"
