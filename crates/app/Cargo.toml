[package]
name = "rugen"
description = "rugen binary: window, input, config, glue"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rugen-formats.workspace = true
rugen-cns.workspace = true
rugen-sim.workspace = true
rugen-net.workspace = true
rugen-render.workspace = true
rugen-audio.workspace = true
rugen-content.workspace = true
winit.workspace = true
gilrs.workspace = true
pollster.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json = "1"
toml.workspace = true
png.workspace = true
libm.workspace = true
ab_glyph = "0.2"
image-webp = "0.2"
rugen-ui.workspace = true

[lints]
workspace = true

[package.metadata.generate-rpm]
summary = "MUGEN-compatible 2D fighting game engine"
license = "MIT OR Apache-2.0"
assets = [
  { source = "target/release/rugen", dest = "/usr/bin/rugen", mode = "755" },
  { source = "LICENSE-MIT", dest = "/usr/share/licenses/rugen/LICENSE-MIT", mode = "644", doc = true },
  { source = "LICENSE-APACHE", dest = "/usr/share/licenses/rugen/LICENSE-APACHE", mode = "644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/rugen/README.md", mode = "644", doc = true },
]
[package.metadata.generate-rpm.requires]
systemd-libs = "*"
alsa-lib = "*"
