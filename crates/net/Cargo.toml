[package]
name = "rugen-net"
description = "Rollback netplay via ggrs, server relay client (UDP / WebSocket), lobby API client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rugen-sim.workspace = true
ggrs.workspace = true
log.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json = "1"
rugen-proto.workspace = true
bincode = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# TURN client (crate::turn / crate::stun); rustls + roots are already pulled in by tungstenite / ureq
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
crc32fast = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[lints]
workspace = true
